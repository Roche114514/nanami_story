<script>
const PLUGIN = "community.nanami.story";
const PAGE = "story_lobby";

const state = {
  token: "",
  characters: [],
  charactersInitialized: false,
  charactersKey: "",
  realms: [],
  sessions: [],
  leftMode: "dialogue",
  pollTimer: null,
  dialogueMode: "inject",
  dialogueMouthRevision: 0,
  currentChat: null,
  conversations: [],
  conversationsLoaded: false,
  dialogueCharacters: new Set(),
  dialogueCharactersKey: "",
  hostCharacterNames: null,
  dialogueDraft: null,
  dialoguePresets: [],
  chatBindings: {},
  backgrounds: [],
  dialogueSceneIndex: 0,
  targetBgCache: {},
};

let sessionsRevision = 0;

function el(id) { return document.getElementById(id); }

function esc(v) {
  return String(v == null ? "" : v).replace(/[&<>"]/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));
}

function getBridgeToken() {
  const params = new URLSearchParams(window.location.search);
  return params.get("shinsekai_bridge_token") || params.get("token") || params.get("bridge_token") || "";
}

function withToken(url) {
  if (!state.token) return url;
  return url + (url.includes("?") ? "&" : "?") + "shinsekai_bridge_token=" + encodeURIComponent(state.token);
}

let _toastTimer = null;
function toast(msg, isErr = false) {
  const box = el("toast");
  if (!box) return;
  box.textContent = String(msg || "");
  box.className = "toast" + (isErr ? " err" : "");
  box.classList.remove("hidden");
  clearTimeout(_toastTimer);
  _toastTimer = setTimeout(() => box.classList.add("hidden"), 4200);
}

async function runAction(actionId, values = {}) {
  const url = withToken(
    "/api/plugins/" + encodeURIComponent(PLUGIN) + "/ui/" + encodeURIComponent(PAGE) + "/actions/" + encodeURIComponent(actionId)
  );
  const resp = await fetch(url, {
    method: "POST",
    credentials: "same-origin",
    cache: "no-store",
    headers: { "Content-Type": "application/json", "X-Shinsekai-Bridge-Token": state.token },
    body: JSON.stringify({ values: values || {} }),
  });
  let data = null;
  try { data = await resp.json(); } catch {}
  const result = data?.result;
  if (!resp.ok || !result || result.ok === false) {
    throw new Error(result?.error || data?.error || data?.detail || data?.message || ("请求失败（HTTP " + resp.status + "）"));
  }
  return result;
}

function closeModal() {
  el("modal-mask").classList.add("hidden");
  el("modal-body").innerHTML = "";
  el("modal-footer").innerHTML = "";
}

function showModal(title, bodyHtml, buttons = []) {
  el("modal-title").textContent = title || "提示";
  el("modal-body").innerHTML = bodyHtml || "";
  const ft = el("modal-footer");
  ft.innerHTML = "";
  const list = buttons.length ? buttons : [{ label: "关闭", cls: "ghost", onClick: closeModal }];
  for (const b of list) {
    const btn = document.createElement("button");
    btn.type = "button";
    btn.className = "btn " + (b.cls || "ghost");
    btn.textContent = b.label || "确定";
    btn.onclick = () => b.onClick && b.onClick(btn);
    ft.appendChild(btn);
  }
  el("modal-mask").classList.remove("hidden");
}

function openConfirmation(title, message, onAccepted) {
  showModal(title, '<div style="font-size:13px;color:var(--text-soft);">' + esc(message) + "</div>", [
    { label: "取消", cls: "ghost", onClick: closeModal },
    {
      label: "确认",
      cls: "danger",
      onClick: async (btn) => {
        btn.disabled = true;
        try {
          await onAccepted();
          closeModal();
        } catch (e) {
          toast(e.message, true);
        } finally {
          btn.disabled = false;
        }
      },
    },
  ]);
}

function switchLeftMode(mode) {
  state.leftMode = mode;
  el("mode-new-btn").classList.toggle("active", mode === "new");
  el("mode-attach-btn").classList.toggle("active", mode === "attach");
  el("mode-dialogue-btn").classList.toggle("active", mode === "dialogue");
  el("panel-mode-new").classList.toggle("hidden", mode !== "new");
  el("panel-mode-attach").classList.toggle("hidden", mode !== "attach");
  el("panel-mode-dialogue").classList.toggle("hidden", mode !== "dialogue");
}

async function hostRequest(path, body) {
  const resp = await fetch(withToken(path), {
    credentials: "same-origin", cache: "no-store",
    method: body === undefined ? "GET" : "POST",
    headers: { "Content-Type": "application/json", "X-Shinsekai-Bridge-Token": state.token },
    body: body === undefined ? undefined : JSON.stringify(body),
  });
  const data = await resp.json();
  if (!resp.ok) throw new Error(data?.error?.message || data?.error || data?.message || "Shinsekai 请求失败");
  return data;
}

function historyKey(path) {
  return String(path || "").replace(/\\/g, "/").replace(/\/(active|branches)\.json$/, "")
    .replace(/\.json$/i, "").replace(/\/$/, "").toLowerCase();
}

function sameHistory(first, second) {
  const a = historyKey(first);
  const b = historyKey(second);
  return Boolean(a && b && (a === b || (!a.includes(":") && !a.startsWith("/") && b.endsWith("/" + a))
    || (!b.includes(":") && !b.startsWith("/") && a.endsWith("/" + b))));
}

function chatIsRunning(status) {
  return Boolean(status?.chatProcessRunning || status?.running || (status?.state && status.state !== "idle"));
}

function selectedChat() {
  return state.conversations.find((row) => row.historyPath === el("dialogue-target").value);
}

function currentBinding() {
  return Object.values(state.chatBindings).find((row) => sameHistory(row.history_path, state.currentChat?.historyPath));
}

function clearDialogueDraft() {
  state.dialogueDraft = null;
  renderDialogueDraft();
}

function selectedBgGroup(name) {
  const key = String(name || "").trim().toLowerCase();
  return state.backgrounds.find((bg) => bg.name.toLowerCase() === key) || null;
}

function parseTagLineLabel(line) {
  const idx = [line.indexOf("："), line.indexOf(":")].filter((n) => n >= 0).sort((a, b) => a - b)[0];
  return idx !== undefined ? line.slice(idx + 1).trim() : line.trim();
}

function normalizeBackgroundCatalog(rows) {
  if (!Array.isArray(rows)) return [];
  const out = [];
  for (const row of rows) {
    const name = String(row?.name || "").trim();
    if (!name || name === "透明场景" || name === "透明背景") continue;
    let scenes = [];
    if (Array.isArray(row.scenes) && row.scenes.length) {
      scenes = row.scenes.map((sc, idx) => ({
        index: Number(sc.index || idx + 1),
        label: String(sc.label || ("场景 " + (idx + 1))),
        path: String(sc.path || ""),
      }));
    } else if (Array.isArray(row.sprites)) {
      const tagLines = String(row.bg_tags || "").split(/\r?\n/).map((s) => s.trim()).filter(Boolean);
      const labels = {};
      tagLines.forEach((line, i) => {
        const m = line.match(/(\d+)\s*[:：]/);
        labels[m ? Number(m[1]) : (i + 1)] = parseTagLineLabel(line);
      });
      scenes = row.sprites
        .map((sp, i) => ({
          index: i + 1,
          label: labels[i + 1] || ("场景 " + (i + 1)),
          path: String(typeof sp === "string" ? sp : (sp?.path || "")).trim(),
        }))
        .filter((sc) => sc.path);
    }
    if (!scenes.length) continue;
    const bgmCount = Number(row.bgm_count ?? (Array.isArray(row.bgms) ? row.bgms.length : (Array.isArray(row.bgm_list) ? row.bgm_list.length : 0)));
    out.push({ name, scene_count: scenes.length, bgm_count: bgmCount, scenes });
  }
  return out;
}

function mergeBackgrounds(rows) {
  const normalized = normalizeBackgroundCatalog(rows);
  if (!normalized.length && state.backgrounds.length) return;
  state.backgrounds = normalized;
  const select = el("dialogue-background");
  const prev = select.value;
  select.replaceChildren(new Option(normalized.length ? "选择内置背景组…" : "暂无可用内置背景组", ""));
  for (const bg of normalized) {
    const suffix = bg.bgm_count ? (bg.scene_count + " 场景 / " + bg.bgm_count + " 配乐") : (bg.scene_count + " 场景");
    select.add(new Option(bg.name + " · " + suffix, bg.name));
  }
  if (prev && normalized.some((bg) => bg.name === prev)) {
    select.value = prev;
  } else if (!prev && normalized.length && el("dialogue-bg-mode").value === "shinsekai") {
    select.value = normalized[0].name;
  }
  renderScenePicker();
}

function renderScenePicker() {
  const picker = el("dialogue-scene-picker");
  const pickedLabel = el("dialogue-scene-picked");
  if (!picker || !pickedLabel) return;
  const group = selectedBgGroup(el("dialogue-background").value);
  picker.replaceChildren();
  if (!group) {
    state.dialogueSceneIndex = 0;
    pickedLabel.textContent = "请先选择背景组";
    picker.innerHTML = '<span class="cast-empty" style="grid-column:1 / -1;padding:8px 4px;">选择一个 Shinsekai 背景组后即可浏览内置场景图。</span>';
    return;
  }
  const scenes = group.scenes || [];
  if (!scenes.some((sc) => sc.index === state.dialogueSceneIndex)) state.dialogueSceneIndex = 0;
  const activeScene = scenes.find((sc) => sc.index === state.dialogueSceneIndex);
  pickedLabel.textContent = activeScene ? ("场景 " + activeScene.index + " · " + activeScene.label) : "自动匹配";

  const makeCard = ({ index, label, badge, thumbHtml }) => {
    const card = document.createElement("button");
    card.type = "button";
    card.className = "scene-card" + (state.dialogueSceneIndex === index ? " active" : "");
    card.innerHTML =
      '<div class="scene-thumb">' + thumbHtml + '<span class="scene-idx-badge">' + esc(badge) + "</span></div>"
      + '<div class="scene-label" title="' + esc(label) + '">' + esc(label) + "</div>";
    card.onclick = () => {
      state.dialogueSceneIndex = index;
      clearDialogueDraft();
      renderScenePicker();
    };
    return card;
  };

  picker.append(makeCard({
    index: 0,
    label: "随剧本自动挑选",
    badge: "自动",
    thumbHtml: '<span style="font-size:12px;color:var(--pink-soft);font-weight:600;">自动匹配</span>',
  }));
  for (const sc of scenes) {
    const thumbUrl = withToken("/api/media/thumbnail?path=" + encodeURIComponent(sc.path) + "&size=240");
    picker.append(makeCard({
      index: sc.index,
      label: sc.label,
      badge: "#" + sc.index,
      thumbHtml: '<img src="' + esc(thumbUrl) + '" alt="' + esc(sc.label) + '" loading="lazy" onerror="this.remove()" />',
    }));
  }
}

async function inspectTargetBackground(target) {
  const hint = el("dialogue-bg-inject-hint");
  if (!hint) return;
  const mode = el("dialogue-bg-mode").value;
  if (state.dialogueMode !== "inject" || !target || target.kind === "story") {
    hint.classList.add("hidden");
    return;
  }
  let bgName = "";
  if (target.id) {
    if (!(target.id in state.targetBgCache)) {
      const payload = await hostRequest("/api/chat/conversations/" + encodeURIComponent(target.id) + "/launch-payload").catch(() => null);
      state.targetBgCache[target.id] = String(payload?.backgroundName || "").trim();
    }
    bgName = state.targetBgCache[target.id] || "";
  }
  if (selectedChat()?.historyPath !== target.historyPath) return;
  const pickedGroup = el("dialogue-background").value;
  if (mode !== "shinsekai") {
    hint.classList.add("hidden");
    return;
  }
  if (bgName && (!pickedGroup || bgName === pickedGroup)) {
    if (!pickedGroup && selectedBgGroup(bgName)) {
      el("dialogue-background").value = bgName;
      renderScenePicker();
    }
    hint.textContent = "已识别当前对话内置背景组「" + bgName + "」，剧情将直接联动其中场景。";
    hint.classList.remove("hidden");
  } else if (bgName && pickedGroup && bgName !== pickedGroup) {
    hint.textContent = "当前已有对话绑定的是背景组「" + bgName + "」，若改为「" + pickedGroup + "」建议同步切换背景或新建对话。";
    hint.classList.remove("hidden");
  } else {
    hint.textContent = "当前已有对话未启用背景组；若要画面随剧本切场，建议通过「新建剧本对话」开启。";
    hint.classList.remove("hidden");
  }
}

function syncBackgroundUi() {
  const isShinsekai = el("dialogue-bg-mode").value === "shinsekai";
  el("dialogue-bg-box").classList.toggle("hidden", !isShinsekai);
  if (isShinsekai && !el("dialogue-background").value && state.backgrounds.length) {
    const target = state.dialogueMode === "inject" ? selectedChat() : null;
    const cachedBg = target?.id ? state.targetBgCache[target.id] : "";
    el("dialogue-background").value = (cachedBg && selectedBgGroup(cachedBg)?.name) || state.backgrounds[0].name;
  }
  renderScenePicker();
  void inspectTargetBackground(selectedChat());
}

function syncObserverUi({ preserveOpening = false } = {}) {
  const isObserver = el("dialogue-experience-mode").value === "observer";
  el("dialogue-observer-box").classList.toggle("hidden", !isObserver);
  const castCount = state.dialogueMode === "new"
    ? state.dialogueCharacters.size
    : (selectedChat()?.characters || []).length;
  el("dialogue-observer-cast-hint").classList.toggle("hidden", !(isObserver && castCount === 1));
  if (isObserver && !preserveOpening) {
    el("dialogue-observer-autoplay").checked = true;
    if (state.dialogueMode === "new") el("dialogue-opening").checked = true;
  }
}

function renderDialogueTarget() {
  const target = selectedChat();
  const isCurrent = sameHistory(target?.historyPath, state.currentChat?.historyPath);
  const curBar = el("dialogue-current");
  if (state.currentChat) {
    curBar.innerHTML = '<span class="status-dot on"></span><span class="chat-name">当前对话 · '
      + esc(state.currentChat.title || "未命名对话") + "</span>";
  } else {
    curBar.innerHTML = '<span class="status-dot"></span><span class="chat-name" style="color:var(--muted);">当前没有运行中的对话</span>';
  }
  el("dialogue-native-warning").classList.toggle("hidden", target?.kind !== "story");
  const castNames = target?.characters || [];
  el("dialogue-cast").innerHTML = castNames.length
    ? castNames.map((name) => '<span class="cast-pill"><span class="cast-avatar">' + esc(name.slice(0, 1)) + "</span>" + esc(name) + "</span>").join("")
    : '<span class="cast-empty">选择对话后将自动识别参与角色</span>';
  el("dialogue-recent").disabled = !isCurrent || target?.kind === "story";
  if (el("dialogue-recent").disabled) el("dialogue-recent").checked = false;
  const binding = currentBinding();
  const boundSession = binding ? state.sessions.find((row) => row.session_id === binding.session_id) : null;
  const showCue = Boolean(state.dialogueMode === "inject" && isCurrent && binding && target?.kind !== "story");
  el("dialogue-cue").classList.toggle("hidden", !showCue);
  if (showCue) {
    el("dialogue-cue").textContent = boundSession?.experience_mode === "observer"
      ? (Number(boundSession.turn_count || 0) > 0 ? "观剧续演一轮" : "拉开帷幕开演")
      : "推入开场引子";
  }
  if (state.dialogueMode === "inject" && !el("dialogue-submit").dataset.busy) {
    el("dialogue-submit").textContent = !target || isCurrent
      ? "注入到当前对话（免重启立即生效）" : "绑定所选对话";
    el("dialogue-submit").disabled = !target || target.kind === "story";
  }
  syncObserverUi({ preserveOpening: true });
  syncBackgroundUi();
}

async function loadChatTargets(initial = false) {
  const [active, library, runtime] = await Promise.all([
    hostRequest("/api/chat/conversations/current").catch(() => null),
    hostRequest("/api/chat/conversations").catch(() => []),
    hostRequest("/api/chat/runtime-status"),
  ]);
  const rows = Array.isArray(library) ? library : [];
  let current = chatIsRunning(runtime) ? active : null;
  if (chatIsRunning(runtime) && !current?.historyPath) {
    const snapshot = await hostRequest("/api/chat/snapshot").catch(() => null);
    if (snapshot?.historyPath) {
      const binding = Object.values(state.chatBindings).find((row) => sameHistory(row.history_path, snapshot.historyPath));
      const matching = rows.find((row) => sameHistory(row.historyPath, snapshot.historyPath));
      const names = [...new Set([snapshot.characterName, ...(snapshot.sprites || []).map((row) =>
        row.characterName || row.character || row.name)].filter((name) => typeof name === "string" && name))];
      current = matching || {
        historyPath: snapshot.historyPath, title: state.sessions.find((row) => row.session_id === binding?.session_id)?.title,
        kind: snapshot.storyPath || snapshot.storySession || snapshot.story ? "story" : "normal",
        characters: binding?.characters?.length ? binding.characters : names,
      };
    }
  }
  state.currentChat = current?.historyPath ? current : null;
  state.conversations = state.currentChat
    ? [state.currentChat, ...rows.filter((row) => !sameHistory(row.historyPath, state.currentChat.historyPath))]
    : rows;
  state.conversationsLoaded = true;
  const select = el("dialogue-target");
  const previous = select.value;
  select.replaceChildren(new Option("选择目标对话", ""));
  for (const row of state.conversations) {
    const prefix = sameHistory(row.historyPath, state.currentChat?.historyPath) ? "当前 · " : "";
    select.add(new Option(prefix + (row.title || row.characters?.join(" · ") || "未命名对话"), row.historyPath));
  }
  select.value = state.conversations.find((row) => sameHistory(row.historyPath, previous))?.historyPath
    || state.currentChat?.historyPath || "";
  if (previous && !sameHistory(previous, select.value) && state.dialogueMode === "inject") clearDialogueDraft();
  if (initial && !state.currentChat && !state.conversations.length) switchDialogueMode("new");
  renderDialogueTarget();
  return runtime;
}

function switchDialogueMode(mode) {
  if (state.dialogueMode !== mode) clearDialogueDraft();
  state.dialogueMode = mode;
  for (const name of ["inject", "new"]) {
    el("dialogue-" + name + "-btn").classList.toggle("active", mode === name);
    el("dialogue-" + name + "-panel").classList.toggle("hidden", mode !== name);
  }
  el("dialogue-progress").textContent = "";
  if (mode === "new") {
    el("dialogue-submit").textContent = "创建剧本并开启新对话";
    el("dialogue-submit").disabled = false;
    el("dialogue-cue").classList.add("hidden");
    syncObserverUi({ preserveOpening: true });
    syncBackgroundUi();
  } else {
    renderDialogueTarget();
  }
}

function renderDialogueCharacters() {
  const names = state.hostCharacterNames ?? state.characters.map((row) => row.name);
  const key = JSON.stringify(names);
  if (key === state.dialogueCharactersKey) return;
  state.dialogueCharactersKey = key;
  const box = el("dialogue-characters");
  box.replaceChildren();
  if (!names.length) {
    box.innerHTML = '<span class="cast-empty">暂未检测到宿主角色</span>';
    return;
  }
  for (const name of names) {
    const chip = document.createElement("label");
    chip.className = "char-chip";
    const input = document.createElement("input");
    input.type = "checkbox";
    input.checked = state.dialogueCharacters.has(name);
    chip.classList.toggle("is-selected", input.checked);
    const dot = document.createElement("span");
    dot.className = "char-check";
    const txt = document.createElement("span");
    txt.textContent = name;
    input.onchange = () => {
      if (input.checked) state.dialogueCharacters.add(name);
      else state.dialogueCharacters.delete(name);
      chip.classList.toggle("is-selected", input.checked);
      clearDialogueDraft();
      syncObserverUi({ preserveOpening: true });
    };
    chip.append(input, dot, txt);
    box.append(chip);
  }
}

function dialogueSpec() {
  const isShinsekai = el("dialogue-bg-mode").value === "shinsekai";
  return {
    title: el("dialogue-title").value.trim(),
    theme_compass: el("dialogue-theme").value,
    max_nodes: Number(el("dialogue-pacing").value),
    outline: el("dialogue-outline").value,
    characters: state.dialogueMode === "new" ? [...state.dialogueCharacters] : selectedChat()?.characters || [],
    background_mode: isShinsekai ? "shinsekai" : "custom",
    opening_background: isShinsekai ? el("dialogue-background").value : "",
    opening_scene_index: isShinsekai ? Number(state.dialogueSceneIndex || 0) : 0,
    allow_scene_transitions: isShinsekai ? el("dialogue-allow-scene-transitions").checked : true,
    use_narration: state.dialogueMode === "new" && el("dialogue-narration").checked,
    experience_mode: el("dialogue-experience-mode").value,
    observer_autoplay: el("dialogue-experience-mode").value === "observer" && el("dialogue-observer-autoplay").checked,
    observer_interval_sec: Number(el("dialogue-observer-interval").value || 8),
    custom_draft: state.dialogueDraft || {},
  };
}

async function dialogueValues({ preview = false } = {}) {
  const values = dialogueSpec();
  if (!values.characters.length) throw new Error("请选择出场角色或含角色的对话。");
  if (preview || !state.dialogueDraft) delete values.custom_draft;
  if (state.dialogueMode === "inject") {
    const target = selectedChat();
    if (!target || target.kind === "story") throw new Error("请选择普通对话。");
    Object.assign(values, { history_path: target.historyPath, conversation_id: target.id, kind: target.kind });
    if (el("dialogue-recent").checked && sameHistory(target.historyPath, state.currentChat?.historyPath)) {
      const history = await hostRequest("/api/chat/history");
      const current = await hostRequest("/api/chat/snapshot");
      if (!sameHistory(target.historyPath, current.historyPath)) throw new Error("当前对话已切换，请重新选择。");
      values.recent_chat_turns = (Array.isArray(history) ? history : history?.historyEntries || [])
        .filter((row) => ["user", "assistant"].includes(row.role)).slice(-10)
        .map((row) => ({ role: row.role, text: String(row.text || "").slice(0, 320) }));
    }
  }
  return values;
}

function renderDialogueDraft() {
  const draft = state.dialogueDraft;
  const box = el("dialogue-draft");
  box.classList.toggle("hidden", !draft);
  box.replaceChildren();
  if (!draft) return;

  const head = document.createElement("div");
  head.className = "draft-head";
  const headLeft = document.createElement("div");
  headLeft.style.cssText = "display:flex;align-items:center;gap:8px;flex-wrap:wrap;";
  const headTitle = document.createElement("span");
  headTitle.textContent = "开局草案 · 可直接编辑";
  headLeft.append(headTitle);
  if (draft.background_group) {
    const bgTag = document.createElement("span");
    bgTag.className = "pill sky";
    bgTag.textContent = "Shinsekai · " + draft.background_group
      + (draft.background_scene_index ? (" #" + draft.background_scene_index) : "");
    headLeft.append(bgTag);
  }
  const clearBtn = document.createElement("button");
  clearBtn.type = "button";
  clearBtn.className = "btn sm ghost";
  clearBtn.textContent = "收起";
  clearBtn.onclick = clearDialogueDraft;
  head.append(headLeft, clearBtn);
  box.append(head);

  function field(parent, row, key, label, height = 1) {
    const wrap = document.createElement("label");
    wrap.className = "field";
    const caption = document.createElement("span");
    caption.className = "draft-field-label";
    caption.textContent = label;
    const input = document.createElement(height === 1 ? "input" : "textarea");
    if (height === 1) input.type = "text";
    else input.rows = height;
    input.value = row[key] || "";
    input.oninput = () => { row[key] = input.value; };
    wrap.append(caption, input);
    parent.append(wrap);
  }

  field(box, draft, "premise", "开局梗概", 2);
  field(box, draft, "public_incident_fact", "在场角色都知道的事", 2);
  const sceneGrid = document.createElement("div");
  sceneGrid.className = "row2";
  sceneGrid.style.marginBottom = "9px";
  const draftGroup = draft.background_group ? selectedBgGroup(draft.background_group) : null;
  if (draftGroup) {
    const wrap = document.createElement("label");
    wrap.className = "field";
    const caption = document.createElement("span");
    caption.className = "draft-field-label";
    caption.textContent = "Shinsekai 开场场景";
    const sel = document.createElement("select");
    for (const sc of draftGroup.scenes || []) {
      sel.add(new Option("场景 " + sc.index + " · " + sc.label, String(sc.index)));
    }
    sel.value = String(draft.background_scene_index || draftGroup.scenes[0]?.index || 1);
    sel.onchange = () => {
      const picked = (draftGroup.scenes || []).find((sc) => sc.index === Number(sel.value));
      if (!picked) return;
      draft.background_scene_index = picked.index;
      draft.background_scene_path = picked.path;
      draft.scene_name = picked.label;
    };
    wrap.append(caption, sel);
    sceneGrid.append(wrap);
  } else {
    field(sceneGrid, draft, "scene_name", "场景名称");
  }
  field(sceneGrid, draft, "atmosphere", "场景氛围");
  box.append(sceneGrid);

  draft.node1 ||= {};
  field(box, draft.node1, "situation", "开场处境", 2);
  field(box, draft.node1, "dilemma_frame", "开场两难", 2);

  draft.character_roles ||= {};
  for (const name of dialogueSpec().characters) {
    if (!Object.hasOwn(draft.character_roles, name)) {
      Object.defineProperty(draft.character_roles, name, { value: {}, enumerable: true });
    }
    const row = draft.character_roles[name];
    const group = document.createElement("div");
    group.className = "dialogue-role";
    const heading = document.createElement("div");
    heading.className = "dialogue-role-head";
    const badge = document.createElement("span");
    badge.className = "role-badge";
    badge.textContent = name.slice(0, 1);
    const title = document.createElement("span");
    title.textContent = name;
    heading.append(badge, title);
    group.append(heading);
    field(group, row, "local_role", "剧中身份");
    field(group, row, "relationship_to_incident", "只有该角色知道的秘密或牵挂", 2);
    box.append(group);
  }
}

function setDialoguePresets(rows, selected) {
  if (!Array.isArray(rows)) return;
  state.dialoguePresets = rows;
  const select = el("dialogue-preset");
  const target = selected || select.value;
  select.replaceChildren(new Option("选择剧本预设…", ""));
  for (const row of rows) select.add(new Option(row.title, row.preset_id));
  select.value = rows.some((row) => row.preset_id === target) ? target : "";
}

function selectedPreset() {
  const preset = state.dialoguePresets.find((row) => row.preset_id === el("dialogue-preset").value);
  if (!preset) throw new Error("请先选择预设。");
  return preset;
}

function loadDialoguePreset(preset) {
  el("dialogue-title").value = preset.title || "";
  el("dialogue-theme").value = preset.theme_compass || "auto";
  el("dialogue-pacing").value = String(preset.max_nodes || 0);
  el("dialogue-outline").value = preset.outline || "";
  const isShinsekai = preset.background_mode === "shinsekai" || Boolean(preset.opening_background);
  el("dialogue-bg-mode").value = isShinsekai ? "shinsekai" : "custom";
  el("dialogue-background").value = preset.opening_background || "";
  state.dialogueSceneIndex = Number(preset.opening_scene_index || 0);
  el("dialogue-allow-scene-transitions").checked = preset.allow_scene_transitions !== false;
  el("dialogue-narration").checked = Boolean(preset.use_narration);
  el("dialogue-experience-mode").value = preset.experience_mode === "observer" ? "observer" : "co_play";
  el("dialogue-observer-autoplay").checked = preset.experience_mode === "observer" && preset.observer_autoplay !== false;
  if (preset.observer_interval_sec) {
    const val = String(Math.round(Number(preset.observer_interval_sec)));
    if ([...el("dialogue-observer-interval").options].some((o) => o.value === val)) {
      el("dialogue-observer-interval").value = val;
    }
  }
  const available = state.hostCharacterNames ?? state.characters.map((row) => row.name);
  state.dialogueCharacters = new Set((preset.characters || []).filter((name) => available.includes(name)));
  state.dialogueCharactersKey = "";
  renderDialogueCharacters();
  state.dialogueDraft = Object.keys(preset.custom_draft || {}).length
    ? JSON.parse(JSON.stringify(preset.custom_draft)) : null;
  renderDialogueDraft();
  syncObserverUi({ preserveOpening: true });
  syncBackgroundUi();
}

function downloadDialogueJSON(title, data) {
  const blob = new Blob([data], { type: "application/json" });
  const url = URL.createObjectURL(blob);
  const link = document.createElement("a");
  link.href = url;
  link.download = String(title || "对话剧本").replace(/[<>:"/\\|?*]/g, "_") + ".json";
  link.click();
  setTimeout(() => URL.revokeObjectURL(url), 1000);
}

function dialogueBusy(button, work) {
  return async () => {
    if (button.dataset.busy) return;
    button.dataset.busy = "true";
    button.disabled = true;
    try { await work(); }
    catch (error) { toast(error.message, true); }
    finally {
      button.disabled = false;
      delete button.dataset.busy;
      if (button.id === "dialogue-submit" && state.dialogueMode === "inject") renderDialogueTarget();
    }
  };
}

async function waitForChatTask(task) {
  const id = task.id || task.taskId;
  if (!id) throw new Error("Shinsekai 没有返回启动任务编号。");
  const deadline = Date.now() + 240000;
  while (Date.now() < deadline) {
    const current = await hostRequest("/api/tasks/" + encodeURIComponent(id));
    el("dialogue-progress").textContent = current.message || "正在启动对话…";
    if (current.status === "succeeded") {
      if (current.result?.status === "error") throw new Error(current.result.statusMessage || "聊天启动失败。");
      return current.result;
    }
    if (["failed", "cancelled"].includes(current.status)) throw new Error(current.error || current.message || "聊天启动失败。");
    await new Promise((resolve) => setTimeout(resolve, 650));
  }
  throw new Error("等待对话启动超时。");
}

async function sendDialogueCue(sessionId, expectedPath) {
  const running = await hostRequest("/api/chat/runtime-status");
  const current = await hostRequest("/api/chat/snapshot");
  if (!chatIsRunning(running) || !sameHistory(current.historyPath, expectedPath)) {
    throw new Error("请先打开此剧本绑定的对话。");
  }
  await runAction("trigger_dialogue_opening", { session_id: sessionId, history_path: current.historyPath });
  toast("已推入开场引子。");
}

async function stepDialogueObserver(sessionId, expectedPath) {
  const running = await hostRequest("/api/chat/runtime-status");
  const current = await hostRequest("/api/chat/snapshot");
  if (!chatIsRunning(running) || !sameHistory(current.historyPath, expectedPath)) {
    throw new Error("请先打开此剧本绑定的对话。");
  }
  const res = await runAction("step_dialogue_observer", { session_id: sessionId, history_path: current.historyPath });
  updateFromServer(res);
  toast("已推送观剧续演，等待角色演绎下一轮。");
}

async function toggleDialogueAutoplay(sessionId, enabled, intervalSec, expectedPath) {
  if (!enabled) {
    updateFromServer(await runAction("toggle_dialogue_autoplay", { session_id: sessionId, enabled: false }));
    toast("已停止自动观剧。");
    return;
  }
  const running = await hostRequest("/api/chat/runtime-status");
  const current = await hostRequest("/api/chat/snapshot");
  if (!chatIsRunning(running) || !sameHistory(current.historyPath, expectedPath)) {
    throw new Error("请先打开此剧本绑定的对话。");
  }
  const res = await runAction("toggle_dialogue_autoplay", {
    session_id: sessionId,
    enabled: true,
    observer_interval_sec: intervalSec || 8,
    trigger_now: true,
    history_path: current.historyPath,
  });
  updateFromServer(res);
  toast("已开启自动连续观剧。");
}

async function launchDialogue(values, previousSessionId = null) {
  const button = el("dialogue-submit");
  button.disabled = true;
  button.dataset.busy = "true";
  el("dialogue-progress").textContent = "正在编织剧本…";
  try {
    const cast = {
      characters: values.characters,
      backgroundName: values.opening_background,
      useChoice: false,
      useStat: false,
      useNarration: values.use_narration,
    };
    const template = await hostRequest("/api/templates/generate", cast);
    const created = await runAction("create_dialogue_story", {
      ...values,
      history_path: "",
      observer_autoplay: Boolean(values.observer_autoplay),
    });
    updateFromServer(created);

    const runtime = await hostRequest("/api/chat/runtime-status");
    if (chatIsRunning(runtime)) {
      if (previousSessionId === null) throw new Error("当前已有对话在运行。再次启动可切换至新对话。");
      el("dialogue-progress").textContent = "正在关闭当前对话…";
      await hostRequest("/api/chat/close", { expectedSessionId: previousSessionId });
    }

    el("dialogue-progress").textContent = "正在启动 Shinsekai 对话…";
    const task = await hostRequest("/api/chat/init", {
      mode: "launch",
      payload: {
        ...cast,
        characters: template.resolvedCharacters || cast.characters,
        system: template.system,
        scenario: template.scenario || "",
        resetHistory: true,
        conversationTitle: created.session.title,
      },
    });
    const taskResult = await waitForChatTask(task);
    const snapshot = await hostRequest("/api/chat/snapshot").catch(() => null);
    const realHistoryPath = String(snapshot?.historyPath || taskResult?.historyPath || "").trim();
    if (!realHistoryPath) {
      throw new Error("Shinsekai 已启动对话，但未返回真实存档路径，请在卡片中手动绑定当前对话。");
    }

    const library = await hostRequest("/api/chat/conversations").catch(() => []);
    const matchingConv = Array.isArray(library)
      ? library.find((row) => sameHistory(row.historyPath, realHistoryPath))
      : null;

    const bound = await runAction("bind_dialogue_session", {
      session_id: created.session.session_id,
      history_path: realHistoryPath,
      conversation_id: matchingConv?.id || "",
      characters: template.resolvedCharacters || values.characters,
    });
    updateFromServer(bound);

    if (values.experience_mode === "observer" && values.observer_autoplay) {
      const autoRes = await runAction("toggle_dialogue_autoplay", {
        session_id: created.session.session_id,
        enabled: true,
        observer_interval_sec: Number(values.observer_interval_sec || 8),
        trigger_now: true,
        history_path: realHistoryPath,
      });
      updateFromServer(autoRes);
      toast("已创建剧本、绑定新对话并开启自动观剧。");
    } else if (values.auto_opening) {
      await sendDialogueCue(created.session.session_id, realHistoryPath);
    } else {
      toast("已创建剧本并绑定新对话。");
    }

    await loadChatTargets();
    el("dialogue-progress").textContent =
      "新剧本对话已启动并完成绑定！若当前不在聊天舞台内，请前往「聊天管理」顶部点击「打开聊天」进入（无需点击下方「继续聊天」）。";
    return bound;
  } finally {
    button.disabled = false;
    delete button.dataset.busy;
  }
}

async function submitDialogue() {
  const runtime = await loadChatTargets();
  const values = await dialogueValues();
  if (state.dialogueMode === "inject") {
    const autoOpeningCue = values.experience_mode === "observer"
      && values.observer_autoplay
      && sameHistory(values.history_path, state.currentChat?.historyPath);
    const response = await runAction("create_dialogue_story", { ...values, trigger_opening: autoOpeningCue });
    updateFromServer(response);
    if (response.opening_error) toast(response.opening_error, true);
    if (sameHistory(values.history_path, state.currentChat?.historyPath)) {
      el("dialogue-progress").textContent = values.experience_mode === "observer"
        ? (values.observer_autoplay ? "已开启自动连续观剧，将持续演至篇章落幕。" : "已切入观剧模式，点击「开演 / 续演一轮」即可看角色自主对戏。")
        : "已注入当前对话，角色会在下一次回复时自然接续剧本。";
    } else {
      el("dialogue-progress").textContent = "已绑定所选对话，打开后立即生效。";
    }
    toast("剧本绑定成功。");
    return;
  }
  values.auto_opening = el("dialogue-opening").checked;
  if (!chatIsRunning(runtime)) {
    await launchDialogue(values);
    return;
  }
  const snapshot = await hostRequest("/api/chat/snapshot");
  if (!snapshot.sessionId && !snapshot.historyPath) throw new Error("当前对话正在切换，请稍后再试。");
  openConfirmation("切换对话", "Shinsekai 需要先关闭当前对话，再开启新剧本对话。", () =>
    launchDialogue(values, snapshot.sessionId || ""));
}

function renderCharacters() {
  const box = el("cfg-chars");
  const key = state.characters.map((c) => `${c.name}:${c.persona_bound ? 1 : 0}`).join("|");
  if (state.charactersInitialized && key === state.charactersKey) return;
  const prevChecked = new Set(
    Array.from(box.querySelectorAll('input[name="imp-char"]:checked')).map((i) => i.value)
  );
  const allowAutoDefault = !state.charactersInitialized || !state.charactersKey;
  box.innerHTML = "";
  if (!state.characters.length) {
    state.charactersInitialized = true;
    state.charactersKey = "";
    box.innerHTML = '<span class="cast-empty">暂未探测到宿主角色，将自动生成具备差异化性格的原生居民。</span>';
    return;
  }
  for (const ch of state.characters) {
    const lbl = document.createElement("label");
    lbl.className = "char-chip";
    const cb = document.createElement("input");
    cb.type = "checkbox";
    cb.name = "imp-char";
    cb.value = ch.name;
    cb.checked = prevChecked.has(ch.name) || (allowAutoDefault && ch.name === "七海千秋");
    lbl.classList.toggle("is-selected", cb.checked);
    cb.onchange = () => lbl.classList.toggle("is-selected", cb.checked);
    const dot = document.createElement("span");
    dot.className = "char-check";
    const span = document.createElement("span");
    span.textContent = ch.name + (ch.persona_bound ? " · 已绑人格" : "");
    lbl.append(cb, dot, span);
    box.appendChild(lbl);
  }
  state.charactersInitialized = true;
  state.charactersKey = key;
}

function renderRealmsSelect() {
  const relSrc = el("cfg-relation-source");
  if (relSrc) {
    const prevSrc = relSrc.value || "auto";
    const baseOpts = [
      { value: "auto", label: "自动继承文字世界设定（优先默认初始关系）" },
      { value: "__default__", label: "仅使用角色管理「默认初始关系」" },
      ...state.realms
        .filter((r) => !r.isolated_persona)
        .map((r) => ({
          value: r.realm_space_id,
          label: "仅继承世界「" + (r.name || r.realm_space_id) + "」的情感关系",
        })),
      { value: "story_fresh", label: "不继承文字世界关系（按故事默认：同行旅伴）" },
    ];
    relSrc.innerHTML = baseOpts
      .map((o) => '<option value="' + esc(o.value) + '">' + esc(o.label) + "</option>")
      .join("");
    relSrc.value = baseOpts.some((o) => o.value === prevSrc) ? prevSrc : "auto";
  }

  const sel = el("attach-realm-select");
  if (!sel) return;
  const prev = sel.value;
  if (!state.realms.length) {
    sel.innerHTML = '<option value="">（当前暂无已生成的常驻小镇）</option>';
    el("btn-attach-fate").disabled = true;
    return;
  }
  el("btn-attach-fate").disabled = false;
  sel.innerHTML = state.realms.map((r) =>
    '<option value="' + esc(r.realm_space_id) + '">'
    + esc(r.name || r.realm_space_id)
    + " · " + (r.building_count || 0) + "栋 / " + (r.actors?.length || 0) + "位居民"
    + (r.is_active ? " [当前]" : "")
    + "</option>"
  ).join("");
  if (prev && state.realms.some((r) => r.realm_space_id === prev)) {
    sel.value = prev;
  }
}

function renderSessions() {
  el("sessions-count").textContent = String(state.sessions.length);
  const pane = el("pane-sessions");
  pane.innerHTML = "";
  if (!state.sessions.length) {
    pane.innerHTML =
      '<div class="empty-stage">'
      + '<div class="empty-stage-icon" aria-hidden="true">'
      + '<svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">'
      + '<path d="M12 20h9" /><path d="M16.5 3.5a2.121 2.121 0 0 1 3 3L7 19l-4 1 1-4L16.5 3.5z" />'
      + "</svg></div>"
      + "<h3>等待拨动第一根命运丝线</h3>"
      + "<p>在左侧编织台将对话剧本注入当前聊天、新建剧本对话，或创建并挂载一座活态故事小镇。</p>"
      + "</div>";
    return;
  }

  const phaseLabels = { spark: "初现微光", entangle: "渐入丝线", crossroads: "抉择路口", ripple: "因果涟漪", climax: "心意碰撞", afterglow: "篇章落笔" };
  for (const s of state.sessions) {
    const card = document.createElement("div");
    card.className = "session-item";
    const threads = s.threads || [];
    const activeThread = threads.find((t) => t.status === "active");
    const tensionPct = activeThread ? Math.max(4, Math.min(100, Math.round((activeThread.tension || 0) * 100))) : 0;
    const statusPill = activeThread
      ? '<div class="phase-box">'
        + '<span class="pill warn"><span class="status-dot warn"></span>' + esc(phaseLabels[activeThread.phase] || activeThread.phase) + " · 张力 " + Math.round((activeThread.tension || 0) * 100) + "%</span>"
        + '<div class="tension-bar" title="剧情张力"><i style="width:' + tensionPct + '%;"></i></div>'
        + "</div>"
      : '<div class="phase-box"><span class="pill ok"><span class="status-dot on"></span>日常稳态 · 已落笔 ' + (s.chronicle_archive?.length || 0) + " 篇</span></div>";

    const isDialogue = s.mode === "dialogue";
    const isDialogueObserver = isDialogue && s.experience_mode === "observer";
    const binding = isDialogue ? Object.values(state.chatBindings).find((row) => row.session_id === s.session_id) : null;
    const matchedConv = binding ? state.conversations.find((row) => sameHistory(row.historyPath, binding.history_path)) : null;
    const isBoundCurrent = Boolean(binding && sameHistory(binding.history_path, state.currentChat?.historyPath));
    const bindingBroken = Boolean(binding && state.conversationsLoaded && !matchedConv && !isBoundCurrent);
    const modeTag = isDialogue
      ? (isDialogueObserver ? "对话剧本 · 观剧" : "对话剧本 · 共演")
      : s.mode === "standalone"
        ? (s.experience_mode === "observer" ? "独立舞台 · 观剧" : "独立故事小镇")
        : "常驻小镇挂载";
    const modeCls = isDialogue ? "pink" : (s.mode === "standalone" ? "sky" : "");

    let html =
      '<div class="session-hd">'
      + '<div class="session-title-group">'
      + '<span class="session-title">' + esc(s.title || s.realm_name || s.realm_space_id) + "</span>"
      + '<span class="pill ' + modeCls + '">' + esc(modeTag) + "</span>"
      + "</div>"
      + statusPill
      + "</div>";

    if (isDialogue) {
      const bindingTitle = matchedConv?.title || (isBoundCurrent ? state.currentChat?.title : "");
      const autoPill = isDialogueObserver
        ? (s.observer_autoplay
          ? '<span class="pill pink"><span class="status-dot pink"></span>持续自动观剧中 · 每 ' + Number(s.observer_interval_sec || 8) + "s</span>"
          : '<span class="pill">手动观剧</span>')
        : "";
      const scCtx = s.scene_context || {};
      const bgPill = scCtx.background_mode === "shinsekai" && scCtx.opening_background
        ? '<span class="pill sky">内置背景 · ' + esc(scCtx.opening_background)
          + (scCtx.background_scene_index ? (" · 场景 #" + Number(scCtx.background_scene_index)) : "") + "</span>"
        : "";
      const bindPillCls = bindingBroken ? "warn" : (binding ? "ok" : "");
      const bindDotCls = bindingBroken ? "warn" : (binding ? "on" : "");
      const bindLabel = bindingBroken
        ? "绑定路径失效 · 请重新绑定"
        : isBoundCurrent
          ? ("当前运行中 · " + (bindingTitle || "已绑定对话"))
          : binding
            ? (bindingTitle ? "已绑定 · " + bindingTitle : "已绑定对话")
            : "未绑定对话";
      html += '<div class="meta-strip">'
        + '<span class="pill ' + bindPillCls + '">'
        + '<span class="status-dot ' + bindDotCls + '"></span>'
        + esc(bindLabel) + "</span>"
        + bgPill
        + autoPill
        + (s.paused ? '<span class="pill warn">注入已暂停</span>' : "")
        + '<span class="pill">' + Number(s.turn_count || 0) + " 轮</span></div>";
      if (bindingBroken) {
        html += '<div class="dialogue-hint" style="color:var(--amber);">检测到该剧本绑定的对话存档已不存在，请点击下方「重绑对话」重新关联真实对话。</div>';
      } else if (binding && !isBoundCurrent && !state.currentChat && state.conversationsLoaded) {
        html += '<div class="dialogue-hint">当前无运行中对话，可在 Shinsekai「聊天管理」找到「'
          + esc(bindingTitle || s.title || "此对话") + '」点击「继续聊天」打开。</div>';
      }
      if (isDialogueObserver && s.observer_status_note) {
        html += '<div class="dialogue-hint" style="color:var(--amber);">' + esc(s.observer_status_note) + "</div>";
      }
      if (isDialogueObserver && isBoundCurrent && s.status === "active" && !s.paused && activeThread && s.observer_autoplay === false) {
        const stepLabel = Number(s.turn_count || 0) > 0 ? "续演一轮" : "开演一轮";
        html += '<div class="dialogue-hint">当前为手动观剧。点击「' + stepLabel + '」播放下一轮，或点击「自动观剧」连续播放。</div>';
      }
      for (const whisper of (s.director_whispers || []).filter((row) => row.expires_after_turn > s.turn_count)) {
        html += '<div class="whisper-banner"><span class="whisper-tag">导演耳语</span>'
          + '<span class="pill">' + esc(whisper.target || "全体") + "</span>"
          + "<span>" + esc(whisper.text) + "</span></div>";
      }
    }

    const showThread = activeThread || threads[threads.length - 1];
    if (showThread) {
      html += '<div class="thread-premise"><strong>《' + esc(showThread.title) + "》</strong>"
        + (showThread.premise ? " — " + esc(showThread.premise) : "") + "</div>";

      html += '<div class="timeline">';
      for (const node of (showThread.nodes || [])) {
        const cls = node.status === "active" ? "active" : "done";
        const fl = node.target_floor_label ? "(" + node.target_floor_label + ")" : "";
        const loc = isDialogue ? "" : (node.target_space_name || "") + fl + (node.target_zone_name ? " · " + node.target_zone_name : "");
        const choices = Object.values(node.participant_choices || {}).map((c) =>
          '<div class="choice-item">'
          + '<div class="choice-head">'
          + '<span class="choice-actor">' + esc(c.actor_name) + "</span>"
          + '<span class="stance-tag">' + esc(c.stance_label || c.stance) + "</span>"
          + "</div>"
          + '<div class="choice-summary">' + esc(c.choice_summary) + "</div>"
          + (c.inner_reason ? '<div class="thought-box">心路：' + esc(c.inner_reason) + "</div>"
            : (c.inner_hidden ? '<div class="thought-hidden">内心独白已按设置收起，可点击「查看心路」或待篇章收束揭晓</div>' : ""))
          + "</div>"
        ).join("");
        const pStance = node.player_stance
          ? '<div class="node-stance">你的表态 [' + esc(node.player_stance.stance_label) + "]：" + esc(node.player_stance.note) + "</div>"
          : "";
        const stepLabel = Number(showThread.max_nodes || 0) > 0
          ? ("第 " + (node.seq || 1) + "/" + showThread.max_nodes + " 拍")
          : ("第 " + (node.seq || 1) + " 幕");
        const factsHtml = (isDialogue && node.revealed_facts?.length)
          ? '<div class="fact-chips">' + node.revealed_facts.map((f) => '<span class="fact-chip">' + esc(f) + "</span>").join("") + "</div>"
          : "";
        html +=
          '<div class="node-card ' + cls + '">'
          + '<div class="node-top">'
          + '<span class="node-step">' + stepLabel + "</span>"
          + (isDialogue && node.background_scene_index ? '<span class="pill sky" style="padding:1px 7px;font-size:10.5px;">场景 #' + Number(node.background_scene_index) + "</span>" : "")
          + '<span class="node-title">' + esc(node.title) + "</span>"
          + (loc ? '<span class="node-loc">· ' + esc(loc) + "</span>" : "")
          + "</div>"
          + '<div class="node-situation">' + esc(node.situation) + "</div>"
          + (node.status === "active" && node.dilemma_frame ? '<div class="node-dilemma">十字路口：' + esc(node.dilemma_frame) + "</div>" : "")
          + pStance
          + factsHtml
          + (choices ? '<div class="choice-list">' + choices + "</div>" : '<div class="dialogue-hint" style="margin-top:6px;">等待在场角色感知节点并做出决定…</div>')
          + (node.outcome_summary ? '<div class="outcome-line">因果推进：' + esc(node.outcome_summary) + "</div>" : "")
          + "</div>";
      }
      html += "</div>";

      if (showThread.chapter_chronicle) {
        const cc = showThread.chapter_chronicle;
        const characterEnds = isDialogue ? Object.entries(cc.character_epilogues || {}).map(([key, value]) =>
          '<div class="dialogue-hint" style="margin-top:4px;"><b style="color:var(--text);">' + esc(s.ledgers?.[key]?.name || key) + " · </b>" + esc(value) + "</div>").join("") : "";
        html += '<div class="epilogue-card"><div class="epilogue-card-title">' + esc(cc.title) + '</div><div class="epilogue-card-body">' + esc(cc.epilogue) + "</div>"
          + characterEnds + "</div>";
      }
    }

    const ledgerEntries = Object.values(s.ledgers || {});
    if (ledgerEntries.length) {
      const ledgerCards = ledgerEntries.map((lg) => {
        const exps = (lg.experienced_events || []).slice(-2).map((ev) => esc(ev.summary)).join("；") || "暂无显著见闻";
        const asp = (lg.arc_state?.aspirations || []).slice(-1)[0] || "";
        const prom = (lg.arc_state?.promises || []).slice(-1)[0] || "";
        return '<div class="ledger-card">'
          + '<div class="ledger-name"><span class="role-badge">' + esc((lg.name || "?").slice(0, 1)) + "</span><span>" + esc(lg.name) + (lg.is_player ? "（你）" : "") + "</span></div>"
          + '<div class="ledger-row"><b>见闻：</b>' + exps + "</div>"
          + (asp ? '<div class="ledger-row asp"><b>念想：</b>' + esc(asp) + "</div>" : "")
          + (prom ? '<div class="ledger-row prom"><b>承诺：</b>' + esc(prom) + "</div>" : "")
          + "</div>";
      }).join("");
      html += '<details class="ledger-section" open><summary class="ledger-summary">在场角色记事 (' + ledgerEntries.length + ')</summary><div class="ledger-grid">' + ledgerCards + "</div></details>";
    }

    card.innerHTML = html;
    const actRow = document.createElement("div");
    actRow.className = "session-actions";
    const mainGroup = document.createElement("div");
    mainGroup.className = "actions-main";
    const utilGroup = document.createElement("div");
    utilGroup.className = "actions-util";

    const mkBtn = (label, cls, handler) => {
      const b = document.createElement("button");
      b.type = "button";
      b.className = "btn sm " + (cls || "ghost");
      b.textContent = label;
      b.onclick = () => handler(b);
      return b;
    };

    if (!isDialogue) {
      const enter = document.createElement("a");
      enter.className = "btn sm primary";
      enter.textContent = "进入故事世界";
      const q = new URLSearchParams({ space_id: s.realm_space_id, view: "world" });
      if (s.mode === "standalone") q.set("mode", "story");
      enter.href = withToken("/api/plugins/community.nanami.world/frontend/world_canvas/?" + q);
      mainGroup.appendChild(enter);
    }

    if (activeThread) {
      mainGroup.appendChild(mkBtn("推进一拍", "accent", async (b) => {
        const orig = b.textContent;
        b.disabled = true;
        b.textContent = "推演中…";
        try {
          const values = { session_id: s.session_id, force_evaluate: true, sync_models: true };
          const historyPath = state.currentChat?.historyPath;
          if (isDialogueObserver && s.status === "active" && binding && sameHistory(binding.history_path, historyPath)) {
            Object.assign(values, { trigger_observer_cue: true, history_path: historyPath });
          }
          const res = await runAction(isDialogue ? "advance_dialogue_beat" : "tick_fate_session", values);
          updateFromServer(res);
          if (res.cue_submitted) toast("已推进对话剧情并推送续演信号。");
          else if (res.cue_error) toast(res.cue_error, true);
          else toast(isDialogue ? "已推进对话剧情。" : "已顺着角色的选择与后果编排下一拍。");
        } catch (e) { toast(e.message, true); } finally { b.disabled = false; b.textContent = orig; }
      }));
    } else {
      mainGroup.appendChild(mkBtn("拨动新丝线", "accent", async (b) => {
        const orig = b.textContent;
        b.disabled = true;
        b.textContent = "编织中…";
        try {
          const res = await runAction(isDialogue ? "pluck_dialogue_thread" : "pluck_fate_thread", { session_id: s.session_id });
          updateFromServer(res);
          toast("已拨动一条新的命运丝线。");
        } catch (e) { toast(e.message, true); } finally { b.disabled = false; b.textContent = orig; }
      }));
    }

    mainGroup.appendChild(mkBtn(s.reveal_inner_thoughts ? "隐藏心路" : "查看心路", "ghost", async (b) => {
      b.disabled = true;
      try {
        const res = await runAction("toggle_fate_thoughts", { session_id: s.session_id });
        updateFromServer(res);
      } catch (e) { toast(e.message, true); } finally { b.disabled = false; }
    }));

    if (isDialogue) {
      renderDialogueSessionActions(mainGroup, utilGroup, mkBtn, s, binding, { bindingBroken });
    } else if (s.mode === "standalone") {
      utilGroup.appendChild(mkBtn("删除舞台", "danger", () => {
        openConfirmation("删除独立故事舞台", "将彻底删除这个独立生成的故事舞台、原生居民与角色记忆（不影响主档与常驻小镇）。确定继续吗？", async () => {
          const res = await runAction("detach_fate_session", { session_id: s.session_id, delete_world: true });
          updateFromServer(res);
          toast("已删除独立故事舞台。");
        });
      }));
    } else {
      utilGroup.appendChild(mkBtn("解绑（保留小镇）", "danger", () => {
        openConfirmation("解绑命运丝线", "确定解绑该常驻小镇的命运丝线吗？（小镇建筑、居民与物品会完整保留）", async () => {
          const res = await runAction("detach_fate_session", { session_id: s.session_id, delete_world: false });
          updateFromServer(res);
          toast("已解绑命运丝线，小镇完整保留。");
        });
      }));
    }

    actRow.append(mainGroup, utilGroup);
    card.appendChild(actRow);
    pane.appendChild(card);
  }
}

function openRebindModal(session) {
  const normalConvs = (state.conversations || []).filter((row) => row.historyPath && row.kind !== "story");
  showModal(
    "重新绑定 Shinsekai 对话",
    '<div class="field"><label for="modal-rebind-select">选择目标普通对话</label>'
      + '<select id="modal-rebind-select"></select></div>'
      + '<div class="dialogue-hint">关联后，通过「聊天管理 -> 继续聊天」打开该对话时将自动装载此剧本。</div>',
    [
      { label: "取消", cls: "ghost", onClick: closeModal },
      {
        label: "确认绑定",
        cls: "primary",
        onClick: (button) => dialogueBusy(button, async () => {
          const pickedPath = el("modal-rebind-select").value;
          const picked = normalConvs.find((row) => row.historyPath === pickedPath);
          if (!picked) throw new Error("请先选择一个普通对话。");
          const res = await runAction("bind_dialogue_session", {
            session_id: session.session_id,
            history_path: picked.historyPath,
            conversation_id: picked.id || "",
            characters: picked.characters?.length ? picked.characters : (session.dialogue_cast || []),
            kind: picked.kind || "normal",
          });
          closeModal();
          updateFromServer(res);
          toast("已重新绑定对话：" + (picked.title || "未命名对话"));
        })(),
      },
    ],
  );
  const sel = el("modal-rebind-select");
  if (!normalConvs.length) {
    sel.add(new Option("暂无可用的普通对话（请先在聊天管理中新建）", ""));
    return;
  }
  for (const row of normalConvs) {
    const prefix = sameHistory(row.historyPath, state.currentChat?.historyPath) ? "当前 · " : "";
    const chars = row.characters?.length ? (" (" + row.characters.join("·") + ")") : "";
    sel.add(new Option(prefix + (row.title || "未命名对话") + chars, row.historyPath));
  }
  if (state.currentChat && normalConvs.some((row) => sameHistory(row.historyPath, state.currentChat.historyPath))) {
    sel.value = normalConvs.find((row) => sameHistory(row.historyPath, state.currentChat.historyPath)).historyPath;
  }
}

function renderDialogueSessionActions(mainGroup, utilGroup, mkBtn, session, binding, { bindingBroken = false } = {}) {
  const session_id = session.session_id;
  const isObserver = session.experience_mode === "observer";
  const addTo = (group, label, cls, action, values = {}, success = "") => group.appendChild(mkBtn(label, cls, (button) =>
    dialogueBusy(button, async () => {
      updateFromServer(await runAction(action, { session_id, ...values }));
      if (success) toast(success);
    })()
  ));

  if (bindingBroken) {
    mainGroup.appendChild(mkBtn("重绑对话", "primary", (button) => dialogueBusy(button, async () => {
      await loadChatTargets();
      openRebindModal(session);
    })()));
  }

  if (isObserver && binding && !bindingBroken) {
    mainGroup.prepend(
      mkBtn(
        Number(session.turn_count || 0) > 0 ? "续演一轮" : "开演一轮",
        "primary",
        (button) => dialogueBusy(button, () => stepDialogueObserver(session_id, binding.history_path))(),
      ),
      mkBtn(
        session.observer_autoplay ? "停止自动观剧" : "自动观剧",
        session.observer_autoplay ? "warn" : "accent",
        (button) => dialogueBusy(button, () => toggleDialogueAutoplay(
          session_id, !session.observer_autoplay, Number(session.observer_interval_sec || 8), binding.history_path,
        ))(),
      ),
    );
  }

  mainGroup.appendChild(mkBtn("导演耳语", "accent", () => {
    showModal("导演耳语",
      '<div class="field"><label for="whisper-text">想让角色此刻浮现的念头</label><textarea id="whisper-text" rows="3" maxlength="240" placeholder="例如：窗外的雨声忽然让他想起了三年前未寄出的信…"></textarea></div>'
      + '<div class="row2">'
      + '<div class="field"><label for="whisper-target">对象</label><select id="whisper-target"></select></div>'
      + '<div class="field"><label for="whisper-duration">持续轮数</label><input id="whisper-duration" type="number" min="1" max="24" value="2" /></div>'
      + "</div>",
      [{ label: "取消", cls: "ghost", onClick: closeModal }, { label: "送入耳语", cls: "primary", onClick: (button) =>
        dialogueBusy(button, async () => {
          const result = await runAction("inject_director_whisper", {
            session_id, text: el("whisper-text").value, target: el("whisper-target").value,
            duration_turns: Number(el("whisper-duration").value),
          });
          closeModal();
          updateFromServer(result);
        })() }],
    );
    el("whisper-target").add(new Option("全体", ""));
    for (const name of session.dialogue_cast || []) el("whisper-target").add(new Option(name, name));
  }));

  addTo(mainGroup, session.paused ? "恢复注入" : "暂停注入", "ghost", "toggle_dialogue_pause", { paused: !session.paused });

  addTo(
    utilGroup,
    isObserver ? "切为共演" : "切为观剧",
    "ghost",
    "set_dialogue_experience_mode",
    { experience_mode: isObserver ? "co_play" : "observer" },
    isObserver ? "已切换为共同参与模式。" : "已切换为纯观剧模式。",
  );
  utilGroup.appendChild(mkBtn("场景背景", "ghost", () => {
    const scCtx = session.scene_context || {};
    const curMode = scCtx.background_mode === "shinsekai" ? "shinsekai" : "custom";
    const curGroup = scCtx.opening_background || state.backgrounds[0]?.name || "";
    const curIdx = Number(scCtx.background_scene_index || scCtx.opening_scene_index || 0);
    const curShift = scCtx.allow_scene_transitions !== false;
    showModal("对话场景背景",
      '<div class="field"><label for="modal-bg-mode">背景来源</label>'
      + '<select id="modal-bg-mode"><option value="custom">自由设定场景</option><option value="shinsekai">Shinsekai 自带背景</option></select></div>'
      + '<div id="modal-bg-details">'
      + '<div class="field"><label for="modal-bg-group">内置背景组</label><select id="modal-bg-group"></select></div>'
      + '<div class="field"><label for="modal-bg-scene">当前 / 开场场景</label><select id="modal-bg-scene"></select></div>'
      + '<label class="toggle-row"><span class="toggle-label">允许随剧情推进切换同组内置场景</span>'
      + '<span class="toggle-switch"><input type="checkbox" id="modal-bg-shift" /><span class="toggle-track"></span></span></label>'
      + "</div>",
      [{ label: "取消", cls: "ghost", onClick: closeModal }, { label: "应用背景", cls: "primary", onClick: (button) =>
        dialogueBusy(button, async () => {
          const modeVal = el("modal-bg-mode").value;
          const res = await runAction("set_dialogue_background", {
            session_id,
            background_mode: modeVal,
            opening_background: modeVal === "shinsekai" ? el("modal-bg-group").value : "",
            opening_scene_index: modeVal === "shinsekai" ? Number(el("modal-bg-scene").value || 0) : 0,
            allow_scene_transitions: modeVal === "shinsekai" ? el("modal-bg-shift").checked : true,
          });
          closeModal();
          updateFromServer(res);
          toast("已更新对话剧本背景设置。");
        })() }],
    );
    const modeSel = el("modal-bg-mode");
    const groupSel = el("modal-bg-group");
    const sceneSel = el("modal-bg-scene");
    const shiftInput = el("modal-bg-shift");
    modeSel.value = curMode;
    shiftInput.checked = curShift;
    groupSel.replaceChildren(new Option(state.backgrounds.length ? "选择内置背景组…" : "暂无可用内置背景组", ""));
    for (const bg of state.backgrounds) groupSel.add(new Option(bg.name + " · " + bg.scene_count + " 场景", bg.name));
    if (curGroup && state.backgrounds.some((bg) => bg.name === curGroup)) groupSel.value = curGroup;

    const fillModalScenes = (selectedIdx) => {
      sceneSel.replaceChildren(new Option("自动匹配", "0"));
      const grp = selectedBgGroup(groupSel.value);
      for (const sc of grp?.scenes || []) {
        sceneSel.add(new Option("场景 " + sc.index + " · " + sc.label, String(sc.index)));
      }
      const target = String(selectedIdx || 0);
      sceneSel.value = [...sceneSel.options].some((o) => o.value === target) ? target : "0";
    };
    const syncModal = () => {
      el("modal-bg-details").classList.toggle("hidden", modeSel.value !== "shinsekai");
    };
    fillModalScenes(curIdx);
    syncModal();
    modeSel.onchange = syncModal;
    groupSel.onchange = () => fillModalScenes(0);
  }));
  addTo(utilGroup, "存为预设", "ghost", "save_dialogue_preset", {}, "已保存为剧本预设。");
  utilGroup.appendChild(mkBtn("导出 JSON", "ghost", () =>
    downloadDialogueJSON(session.title, JSON.stringify(session.dialogue_preset, null, 2))));

  if (binding) {
    addTo(utilGroup, "解除绑定", "ghost", "unbind_dialogue_session");
    if (!bindingBroken) {
      utilGroup.appendChild(mkBtn("重绑对话", "ghost", (button) => dialogueBusy(button, async () => {
        await loadChatTargets();
        openRebindModal(session);
      })()));
    }
  } else {
    utilGroup.appendChild(mkBtn("选择对话绑定", "ghost", (button) => dialogueBusy(button, async () => {
      await loadChatTargets();
      openRebindModal(session);
    })()));
  }

  utilGroup.appendChild(mkBtn("删除剧本", "danger", () => openConfirmation(
    "删除对话剧本", "将删除此剧本、记事与绑定。", async () => {
      updateFromServer(await runAction("detach_fate_session", { session_id }));
      toast("已删除剧本。");
    },
  )));
}

function updateFromServer(res) {
  if (Array.isArray(res.sessions)) state.sessions = res.sessions;
  else if (Array.isArray(res.fate_sessions)) state.sessions = res.fate_sessions;
  if (Array.isArray(res.realms)) {
    state.realms = res.realms;
    renderRealmsSelect();
  }
  if (res.chat_bindings) state.chatBindings = res.chat_bindings;
  setDialoguePresets(res.dialogue_presets, res.preset?.preset_id);
  sessionsRevision++;
  renderDialogueTarget();
  renderSessions();
}

async function loadLobbyState() {
  try {
    const rev = sessionsRevision;
    const mouthRev = state.dialogueMouthRevision;
    const res = await runAction("get_lobby_state", {});
    const pill = el("world-status-pill");
    if (res.world_available) {
      pill.innerHTML = '<span class="status-dot on"></span>文字世界已连接';
      pill.className = "pill ok";
    } else {
      pill.className = "pill hidden";
    }
    const dialoguePill = el("dialogue-status-pill");
    const enabled = res.settings?.enabled !== false;
    dialoguePill.innerHTML = '<span class="status-dot ' + (enabled ? "on" : "warn") + '"></span>'
      + (enabled ? "对话剧本就绪" : "对话剧本已停用");
    dialoguePill.className = enabled ? "pill ok" : "pill warn";
    const mouthToggle = el("dialogue-mouth-decoupling");
    if (mouthRev === state.dialogueMouthRevision && !mouthToggle.hasAttribute("aria-busy")) {
      mouthToggle.checked = res.settings?.dialogue_mouth_decoupling !== false;
      mouthToggle.disabled = false;
    }

    state.characters = res.characters || [];
    if (Array.isArray(res.backgrounds)) mergeBackgrounds(res.backgrounds);
    renderCharacters();
    renderDialogueCharacters();
    if (Array.isArray(res.realms)) {
      state.realms = res.realms;
      renderRealmsSelect();
    }
    if (rev === sessionsRevision) {
      state.sessions = res.sessions || res.fate_sessions || [];
      state.chatBindings = res.chat_bindings || {};
      setDialoguePresets(res.dialogue_presets);
      renderDialogueTarget();
      renderSessions();
    }
  } catch (e) {
    toast(e.message, true);
  }
}

async function saveDialogueMouthSetting(event) {
  const toggle = event.currentTarget;
  const enabled = toggle.checked;
  state.dialogueMouthRevision++;
  toggle.disabled = true;
  toggle.setAttribute("aria-busy", "true");
  try {
    const res = await runAction("set_dialogue_mouth", { dialogue_mouth_decoupling: enabled });
    toggle.checked = res.settings.dialogue_mouth_decoupling;
  } catch (error) {
    toggle.checked = !enabled;
    toast(error.message, true);
  } finally {
    state.dialogueMouthRevision++;
    toggle.removeAttribute("aria-busy");
    toggle.disabled = false;
  }
}

async function createFateStory() {
  const btn = el("btn-create-fate");
  const orig = btn.textContent;
  btn.disabled = true;
  btn.textContent = "正在生成多层舞台与第一道命运丝线…";
  const checkedChars = Array.from(document.querySelectorAll('input[name="imp-char"]:checked')).map((i) => i.value);
  try {
    const res = await runAction("create_fate_story", {
      title: el("cfg-title").value.trim(),
      theme_compass: el("cfg-theme").value,
      experience_mode: el("cfg-mode").value,
      world_mode: el("cfg-world-mode").value,
      max_nodes: Number(el("cfg-max-nodes").value || 0),
      building_count: Number(el("cfg-building-count").value || 5),
      native_npc_count: Number(el("cfg-native-count").value || 2),
      player_name: el("cfg-player-name").value.trim() || "旅人",
      world_prompt: el("cfg-world-prompt").value.trim(),
      outline: el("cfg-outline").value.trim().slice(0, 800),
      imported_characters: checkedChars,
      relation_source: el("cfg-relation-source") ? el("cfg-relation-source").value : "auto",
      use_llm: Boolean(el("cfg-use-llm").checked),
    });
    updateFromServer(res);
    toast("已生成多层故事世界，并在室内悄悄落下了第一道命运丝线。");
  } catch (e) {
    toast(e.message, true);
  } finally {
    btn.disabled = false;
    btn.textContent = orig;
  }
}

async function attachFateWorld() {
  const realmId = el("attach-realm-select")?.value || "";
  if (!realmId) return;
  const btn = el("btn-attach-fate");
  const orig = btn.textContent;
  btn.disabled = true;
  btn.textContent = "正在挂载并拨动命运丝线…";
  try {
    const res = await runAction("attach_fate_world", {
      realm_space_id: realmId,
      theme_compass: el("attach-theme").value,
      prompt_hint: el("attach-hint").value.trim(),
    });
    updateFromServer(res);
    toast("已挂载小镇并拨动第一根命运丝线。");
  } catch (e) {
    toast(e.message, true);
  } finally {
    btn.disabled = false;
    btn.textContent = orig;
  }
}

function init() {
  state.token = getBridgeToken();
  const charMgrLink = el("story-char-mgr-link");
  if (charMgrLink) {
    charMgrLink.href = withToken("/api/plugins/community.nanami.world/frontend/world_canvas/?view=characters");
  }
  el("modal-close-x").onclick = closeModal;
  el("modal-mask").onclick = (event) => {
    if (event.target === el("modal-mask")) closeModal();
  };
  window.addEventListener("keydown", (event) => {
    if (event.key === "Escape" && !el("modal-mask").classList.contains("hidden")) closeModal();
  });

  el("btn-refresh").onclick = async () => {
    await loadLobbyState();
    try { await loadChatTargets(); renderSessions(); }
    catch (error) { toast(error.message, true); }
  };
  el("mode-new-btn").onclick = () => switchLeftMode("new");
  el("mode-attach-btn").onclick = () => switchLeftMode("attach");
  el("mode-dialogue-btn").onclick = () => switchLeftMode("dialogue");
  el("cfg-world-mode").onchange = () => {
    el("cfg-bldg-wrap").classList.toggle("hidden", !["town", "compound"].includes(el("cfg-world-mode").value));
  };
  el("btn-create-fate").onclick = createFateStory;
  el("btn-attach-fate").onclick = attachFateWorld;

  el("dialogue-inject-btn").onclick = () => switchDialogueMode("inject");
  el("dialogue-new-btn").onclick = () => switchDialogueMode("new");
  el("dialogue-target").onchange = () => {
    clearDialogueDraft();
    renderDialogueTarget();
  };
  for (const id of ["dialogue-title", "dialogue-theme", "dialogue-outline", "dialogue-recent"]) {
    el(id).oninput = clearDialogueDraft;
  }
  el("dialogue-experience-mode").onchange = () => {
    clearDialogueDraft();
    syncObserverUi();
  };
  el("dialogue-mouth-decoupling").onchange = saveDialogueMouthSetting;
  el("dialogue-bg-mode").onchange = () => {
    clearDialogueDraft();
    syncBackgroundUi();
  };
  el("dialogue-background").onchange = () => {
    state.dialogueSceneIndex = 0;
    clearDialogueDraft();
    syncBackgroundUi();
  };
  el("dialogue-allow-scene-transitions").onchange = clearDialogueDraft;
  for (let count = 1; count <= 20; count++) el("dialogue-pacing").add(new Option(count + " 拍", count));
  const action = (id, fn) => { el(id).onclick = dialogueBusy(el(id), fn); };
  action("dialogue-preview", async () => {
    const values = await dialogueValues({ preview: true });
    const result = await runAction("preview_dialogue_story", values);
    state.dialogueDraft = result.draft;
    renderDialogueDraft();
  });
  action("dialogue-submit", submitDialogue);
  action("dialogue-cue", async () => {
    const binding = currentBinding();
    if (!binding) return;
    const boundSession = state.sessions.find((row) => row.session_id === binding.session_id);
    if (boundSession?.experience_mode === "observer") {
      await stepDialogueObserver(binding.session_id, binding.history_path);
    } else {
      await sendDialogueCue(binding.session_id, binding.history_path);
    }
  });
  action("dialogue-preset-load", () => loadDialoguePreset(selectedPreset()));
  action("dialogue-preset-save", async () => {
    updateFromServer(await runAction("save_dialogue_preset", { preset: dialogueSpec() }));
    toast("已保存为剧本预设。");
  });
  action("dialogue-preset-export", async () => {
    const preset = selectedPreset();
    const result = await runAction("export_dialogue_preset", { preset_id: preset.preset_id });
    downloadDialogueJSON(preset.title, result.json);
  });
  action("dialogue-preset-delete", () => {
    const preset = selectedPreset();
    openConfirmation("删除预设", "删除预设《" + preset.title + "》？", async () => {
      updateFromServer(await runAction("delete_dialogue_preset", { preset_id: preset.preset_id }));
    });
  });
  el("dialogue-preset-import").onclick = () => el("dialogue-preset-file").click();
  el("dialogue-preset-file").onchange = (event) => {
    const file = event.target.files?.[0];
    event.target.value = "";
    if (!file) return;
    void dialogueBusy(el("dialogue-preset-import"), async () => {
      if (file.size > 256000) throw new Error("剧本预设文件太大。");
      const result = await runAction("import_dialogue_preset", { json: await file.text() });
      updateFromServer(result);
      loadDialoguePreset(result.preset);
      toast("已导入剧本预设。");
    })();
  };
  void hostRequest("/api/backgrounds").then((rows) => {
    if (!state.backgrounds.length) mergeBackgrounds(rows);
  }).catch(() => {});
  void hostRequest("/api/characters?view=names").then((rows) => {
    if (!Array.isArray(rows)) return;
    state.hostCharacterNames = rows.filter((name) => typeof name === "string" && name);
    renderDialogueCharacters();
  }).catch(() => {});
  void loadLobbyState().then(() => loadChatTargets(true)).then(renderSessions).catch((error) => {
    toast(error.message, true);
  });
  state.pollTimer = setInterval(() => {
    if (!document.hidden) void loadLobbyState().catch(() => {});
  }, 5000);
}

window.addEventListener("DOMContentLoaded", init);
</script>
</body>
