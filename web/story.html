<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1" />
<title>七海千秋 · 命运丝线故事引擎</title>
<style>
  :root {
    --bg: #151722;
    --panel: #1f2233;
    --panel-2: #272b40;
    --border: #3a405e;
    --text: #eef1fa;
    --muted: #9aa4c2;
    --accent: #f2b8c8;
    --accent-2: #8ecae6;
    --ok: #7bd88f;
    --warn: #ffd166;
    --err: #ff758f;
  }
  * { box-sizing: border-box; }
  html, body {
    margin: 0;
    padding: 0;
    height: 100%;
    background: var(--bg);
    color: var(--text);
    font-family: "Segoe UI", "Microsoft YaHei", sans-serif;
    font-size: 13px;
  }
  .shell {
    display: flex;
    flex-direction: column;
    height: 100vh;
    overflow: hidden;
  }
  .topbar {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 10px;
    padding: 10px 16px;
    background: var(--panel);
    border-bottom: 1px solid var(--border);
  }
  .brand {
    display: flex;
    align-items: center;
    gap: 10px;
    font-weight: 700;
    font-size: 15px;
    color: var(--accent);
  }
  .pill {
    display: inline-flex;
    align-items: center;
    gap: 4px;
    padding: 2px 8px;
    border-radius: 999px;
    border: 1px solid var(--border);
    background: var(--panel-2);
    font-size: 11px;
    color: var(--muted);
  }
  .pill.ok { color: var(--ok); border-color: rgba(123,216,143,.45); }
  .pill.warn { color: var(--warn); border-color: rgba(255,209,102,.45); }
  .pill.err { color: var(--err); border-color: rgba(255,117,143,.45); }
  .btn {
    cursor: pointer;
    border: 1px solid var(--border);
    background: var(--panel-2);
    color: var(--text);
    padding: 6px 12px;
    border-radius: 6px;
    font-size: 12px;
    transition: background .15s, border-color .15s;
  }
  .btn:hover:not(:disabled) { border-color: var(--accent-2); background: #30354f; }
  .btn:disabled { opacity: .5; cursor: not-allowed; }
  .btn.primary { background: #b85b7c; border-color: #e686a7; color: #fff; font-weight: 600; }
  .btn.primary:hover:not(:disabled) { background: #cb698b; }
  .btn.danger { background: #6b2938; border-color: #b5475f; color: #ffdbe2; }
  a.btn { text-decoration: none; display: inline-flex; align-items: center; }
  .btn.sm { padding: 4px 8px; font-size: 11px; }

  .workspace {
    flex: 1;
    display: grid;
    grid-template-columns: 390px 1fr;
    gap: 12px;
    padding: 12px;
    overflow: hidden;
  }
  @media (max-width: 920px) {
    .workspace { grid-template-columns: 1fr; overflow: auto; }
  }
  .card {
    background: var(--panel);
    border: 1px solid var(--border);
    border-radius: 10px;
    display: flex;
    flex-direction: column;
    overflow: hidden;
  }
  .card-hd {
    padding: 10px 14px;
    border-bottom: 1px solid var(--border);
    display: flex;
    align-items: center;
    justify-content: space-between;
    font-weight: 600;
    color: var(--accent-2);
  }
  .card-bd {
    padding: 12px 14px;
    overflow-y: auto;
    flex: 1;
  }
  .field { margin-bottom: 10px; }
  .field label {
    display: block;
    font-size: 11px;
    color: var(--muted);
    margin-bottom: 4px;
  }
  .field input[type="text"], .field input[type="number"], .field select, .field textarea {
    width: 100%;
    background: #141622;
    color: var(--text);
    border: 1px solid var(--border);
    border-radius: 6px;
    padding: 7px 9px;
    font-size: 12px;
    font-family: inherit;
  }
  .field textarea { resize: vertical; min-height: 70px; line-height: 1.5; }
  .row2 { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
  .char-list {
    display: flex;
    flex-wrap: wrap;
    gap: 6px;
    max-height: 115px;
    overflow-y: auto;
    padding: 6px;
    border: 1px solid var(--border);
    border-radius: 6px;
    background: #141622;
  }
  .char-chip {
    display: inline-flex;
    align-items: center;
    gap: 5px;
    padding: 4px 8px;
    border-radius: 6px;
    border: 1px solid var(--border);
    background: var(--panel-2);
    cursor: pointer;
    font-size: 11px;
  }
  .char-chip input { margin: 0; }
  .tabs { display: flex; gap: 6px; }
  .tab-btn {
    padding: 5px 10px;
    border-radius: 6px;
    border: 1px solid var(--border);
    background: transparent;
    color: var(--muted);
    cursor: pointer;
    font-size: 12px;
  }
  .tab-btn.active {
    background: var(--panel-2);
    color: var(--text);
    border-color: var(--accent);
  }
  .session-item {
    border: 1px solid var(--border);
    background: var(--panel-2);
    border-radius: 8px;
    padding: 12px;
    margin-bottom: 12px;
  }
  .session-hd {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 8px;
    margin-bottom: 6px;
  }
  .session-title { font-weight: 700; font-size: 14px; }
  .session-actions { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 10px; }
  .preview-box {
    border: 1px solid var(--border);
    background: #141622;
    border-radius: 8px;
    padding: 10px 12px;
    margin-bottom: 8px;
  }
  .node-card {
    border-left: 3px solid var(--border);
    background: #141622;
    border-radius: 6px;
    padding: 8px 10px;
    margin-bottom: 6px;
  }
  .node-card.active { border-left-color: var(--accent); }
  .node-card.done { border-left-color: var(--ok); }
  .ledger-grid {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(220px, 1fr));
    gap: 6px;
    margin-top: 8px;
  }
  .ledger-card {
    border: 1px solid var(--border);
    border-radius: 6px;
    padding: 7px 9px;
    background: #141622;
    font-size: 11px;
    line-height: 1.5;
  }
  .check-line { display: flex; align-items: center; gap: 6px; font-size: 12px; color: var(--text); cursor: pointer; }
  .hidden { display: none !important; }
  .toast {
    position: fixed;
    right: 16px;
    bottom: 16px;
    z-index: 60;
    padding: 9px 14px;
    border-radius: 8px;
    border: 1px solid var(--border);
    background: #23273d;
    color: var(--text);
    box-shadow: 0 8px 24px rgba(0,0,0,.45);
    max-width: 420px;
  }
  .toast.err { border-color: var(--err); color: #ffd4dc; background: #3d1d29; }
  .modal-mask {
    position: fixed;
    inset: 0;
    z-index: 50;
    background: rgba(10,12,18,.72);
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 16px;
  }
  .modal {
    width: min(620px, 100%);
    max-height: 86vh;
    background: var(--panel);
    border: 1px solid var(--border);
    border-radius: 10px;
    display: flex;
    flex-direction: column;
    overflow: hidden;
  }
  .modal-hd {
    padding: 12px 16px;
    border-bottom: 1px solid var(--border);
    font-weight: 700;
    color: var(--accent);
    display: flex;
    justify-content: space-between;
    align-items: center;
  }
  .modal-bd { padding: 14px 16px; overflow-y: auto; line-height: 1.6; }
  .modal-ft { padding: 10px 16px; border-top: 1px solid var(--border); display: flex; justify-content: flex-end; gap: 8px; }
</style>
</head>
<body>
<div class="shell">
  <header class="topbar">
    <div class="brand">
      <span>🧵 七海千秋 · 命运丝线故事引擎</span>
      <span class="pill" id="world-status-pill">检测世界引擎中…</span>
    </div>
    <div style="display:flex;align-items:center;gap:8px;">
      <button class="btn sm" id="btn-refresh">↻ 刷新大厅</button>
    </div>
  </header>

  <main class="workspace">
    <!-- 左栏：开启命运丝线故事 -->
    <section class="card">
      <div class="card-hd">
        <span>✨ 拨动命运丝线</span>
        <div class="tabs">
          <button class="tab-btn active" id="mode-new-btn">🏡 新建故事</button>
          <button class="tab-btn" id="mode-attach-btn">🧵 挂载小镇</button>
        </div>
      </div>

      <!-- 模式 A：新建独立命运故事小镇 -->
      <div class="card-bd" id="panel-mode-new">
        <div class="row2">
          <div class="field">
            <label>丝线基调罗盘</label>
            <select id="cfg-theme">
              <option value="auto">随在场角色性情生发</option>
              <option value="daily_aspiration">日常微光 · 心愿萌芽</option>
              <option value="bond_turning">羁绊转折 · 心照不宣</option>
              <option value="mystery_ripple">谜团涟漪 · 寻迹探幽</option>
              <option value="crisis_test">风波考验 · 抉择时刻</option>
            </select>
          </div>
          <div class="field">
            <label>体验模式</label>
            <select id="cfg-mode">
              <option value="co_play">自然融入（玩家自由交互影响走向）</option>
              <option value="observer">纯观剧见证（全员自主抉择推进）</option>
            </select>
          </div>
        </div>

        <div class="row2">
          <div class="field">
            <label>舞台空间形态</label>
            <select id="cfg-world-mode">
              <option value="town">立体小镇（多层建筑 + 密闭隔间）</option>
              <option value="compound">室内建筑群（公馆 / 学院 / 旅馆）</option>
              <option value="room">室内聚焦（单层多房空间）</option>
            </select>
          </div>
          <div class="field">
            <label>命运推进节奏</label>
            <select id="cfg-max-nodes">
              <option value="0" selected>自由持续演进（随主角抉择自然推进至终章）</option>
              <option value="4">精炼短篇（约 4 幕内自然收束）</option>
              <option value="8">中篇展开（约 8 幕内自然收束）</option>
              <option value="16">长篇连载（最多 16 幕）</option>
            </select>
          </div>
        </div>

        <div class="row2">
          <div class="field">
            <label>故事标题（可留空由丝线生发）</label>
            <input type="text" id="cfg-title" placeholder="例如：雨夜二楼的未完心愿" />
          </div>
          <div class="field">
            <label>玩家称呼（观剧模式自动跳过）</label>
            <input type="text" id="cfg-player-name" value="旅人" />
          </div>
        </div>

        <div class="row2">
          <div class="field" id="cfg-bldg-wrap">
            <label>建筑数量（3–8）</label>
            <input type="number" id="cfg-building-count" min="3" max="8" value="5" />
          </div>
          <div class="field">
            <label>原生性格居民数量（0–4）</label>
            <input type="number" id="cfg-native-count" min="0" max="4" value="2" />
          </div>
        </div>

        <div class="field">
          <label>舞台环境描述（可选）</label>
          <input type="text" id="cfg-world-prompt" placeholder="例如：带二楼窗景房间和地下室的静谧汤宿小镇" />
        </div>

        <div class="field">
          <label>导入宿主角色（按各自人格自主做决定，零剧透零操纵）</label>
          <div class="char-list" id="cfg-chars"></div>
        </div>

        <div class="field">
          <div style="display:flex;align-items:center;justify-content:space-between;gap:8px;margin-bottom:4px;">
            <label style="margin-bottom:0;">初始情感指针与皮肤（继承自文字世界角色管理）</label>
            <a id="story-char-mgr-link" href="#" target="_blank" rel="noopener noreferrer" style="font-size:11px;color:var(--accent-2);text-decoration:none;">🎭 打开角色管理</a>
          </div>
          <select id="cfg-relation-source">
            <option value="auto">自动继承文字世界设定（优先默认初始关系，其次各世界已设关系）</option>
            <option value="__default__">仅使用角色管理「默认初始关系」</option>
            <option value="story_fresh">不继承文字世界关系（按故事默认：同行旅伴）</option>
          </select>
        </div>

        <div class="field">
          <label>初始意象 / 命运契机提示（仅投放开场节点，不预先写死结局）</label>
          <textarea id="cfg-outline" placeholder="例如：二楼角落出现一本画着聚会草图的旧手札、或者一场骤雨把大家困在了同一栋木屋里…"></textarea>
        </div>

        <div class="field">
          <label class="check-line">
            <input type="checkbox" id="cfg-use-llm" checked />
            <span>使用大模型实时编织节点与角色自主选择</span>
          </label>
        </div>

        <button class="btn primary" id="btn-create-fate" style="width:100%;margin-top:6px;">✨ 创建故事并拨动命运丝线</button>
      </div>

      <!-- 模式 B：直接挂载到已有常驻小镇 -->
      <div class="card-bd hidden" id="panel-mode-attach">
        <div class="preview-box" style="font-size:12px;color:var(--muted);">
          直接附着到你已经建好的活态小镇，保留所有建筑、居民与日常记忆，随时从当前位置轻拨一根命运丝线。
        </div>
        <div class="field">
          <label>选择现有小镇</label>
          <select id="attach-realm-select"></select>
        </div>
        <div class="field">
          <label>丝线基调罗盘</label>
          <select id="attach-theme">
            <option value="auto">随在场角色性情生发</option>
            <option value="daily_aspiration">日常微光 · 心愿萌芽</option>
            <option value="bond_turning">羁绊转折 · 心照不宣</option>
            <option value="mystery_ripple">谜团涟漪 · 寻迹探幽</option>
            <option value="crisis_test">风波考验 · 抉择时刻</option>
          </select>
        </div>
        <div class="field">
          <label>契机提示（可选）</label>
          <textarea id="attach-hint" placeholder="例如：今晚旅馆二楼忽然传来熟悉的琴声…"></textarea>
        </div>
        <button class="btn primary" id="btn-attach-fate" style="width:100%;margin-top:6px;">🧵 挂载小镇并拨动丝线</button>
      </div>
    </section>

    <!-- 右栏：命运丝线轨迹与全角色个人编年史 -->
    <section class="card">
      <div class="card-hd">
        <span>📜 命运丝线轨迹与全角色记事志 (<span id="sessions-count">0</span>)</span>
        <span class="pill ok">节点自主抉择 · 滚动因果编排</span>
      </div>
      <div class="card-bd" id="pane-sessions"></div>
    </section>
  </main>
</div>

<div class="modal-mask hidden" id="modal-mask">
  <div class="modal">
    <div class="modal-hd">
      <span id="modal-title">提示</span>
      <button class="btn sm" id="modal-close-x">✕</button>
    </div>
    <div class="modal-bd" id="modal-body"></div>
    <div class="modal-ft" id="modal-footer"></div>
  </div>
</div>
<div class="toast hidden" id="toast"></div>

<script>
const PLUGIN = "community.nanami.story";
const PAGE = "story_lobby";

const state = {
  token: "",
  characters: [],
  charactersInitialized: false,
  charactersKey: "",
  realms: [],
  sessions: [],
  leftMode: "new",
  pollTimer: null,
};

let sessionsRevision = 0;

function el(id) { return document.getElementById(id); }

function esc(v) {
  return String(v == null ? "" : v).replace(/[&<>"]/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));
}

function getBridgeToken() {
  const params = new URLSearchParams(window.location.search);
  return params.get("shinsekai_bridge_token") || params.get("token") || params.get("bridge_token") || "";
}

function withToken(url) {
  if (!state.token) return url;
  return url + (url.includes("?") ? "&" : "?") + "token=" + encodeURIComponent(state.token);
}

let _toastTimer = null;
function toast(msg, isErr = false) {
  const box = el("toast");
  if (!box) return;
  box.textContent = String(msg || "");
  box.className = "toast" + (isErr ? " err" : "");
  box.classList.remove("hidden");
  clearTimeout(_toastTimer);
  _toastTimer = setTimeout(() => box.classList.add("hidden"), 4200);
}

async function runAction(actionId, values = {}) {
  const url = withToken(
    "/api/plugins/" + encodeURIComponent(PLUGIN) + "/ui/" + encodeURIComponent(PAGE) + "/actions/" + encodeURIComponent(actionId)
  );
  const resp = await fetch(url, {
    method: "POST",
    credentials: "same-origin",
    cache: "no-store",
    headers: { "Content-Type": "application/json" },
    body: JSON.stringify({ values: values || {} }),
  });
  let data = null;
  try { data = await resp.json(); } catch {}
  const result = data?.result;
  if (!resp.ok || !result || result.ok === false) {
    throw new Error(result?.error || data?.error || data?.detail || data?.message || ("请求失败（HTTP " + resp.status + "）"));
  }
  return result;
}

function closeModal() {
  el("modal-mask").classList.add("hidden");
  el("modal-body").innerHTML = "";
  el("modal-footer").innerHTML = "";
}

function showModal(title, bodyHtml, buttons = []) {
  el("modal-title").textContent = title || "提示";
  el("modal-body").innerHTML = bodyHtml || "";
  const ft = el("modal-footer");
  ft.innerHTML = "";
  const list = buttons.length ? buttons : [{ label: "关闭", cls: "", onClick: closeModal }];
  for (const b of list) {
    const btn = document.createElement("button");
    btn.className = "btn " + (b.cls || "");
    btn.textContent = b.label || "确定";
    btn.onclick = () => b.onClick && b.onClick(btn);
    ft.appendChild(btn);
  }
  el("modal-mask").classList.remove("hidden");
}

function openConfirm(title, message, onConfirm) {
  showModal(title, '<div style="font-size:13px;">' + esc(message) + "</div>", [
    { label: "取消", cls: "", onClick: closeModal },
    {
      label: "确认",
      cls: "danger",
      onClick: async (btn) => {
        btn.disabled = true;
        try {
          await onConfirm();
          closeModal();
        } catch (e) {
          toast(e.message, true);
        } finally {
          btn.disabled = false;
        }
      },
    },
  ]);
}

function switchLeftMode(mode) {
  state.leftMode = mode;
  el("mode-new-btn").classList.toggle("active", mode === "new");
  el("mode-attach-btn").classList.toggle("active", mode === "attach");
  el("panel-mode-new").classList.toggle("hidden", mode !== "new");
  el("panel-mode-attach").classList.toggle("hidden", mode !== "attach");
}

function renderCharacters() {
  const box = el("cfg-chars");
  const key = state.characters.map((c) => `${c.name}:${c.persona_bound ? 1 : 0}`).join("|");
  if (state.charactersInitialized && key === state.charactersKey) return;
  const prevChecked = new Set(
    Array.from(box.querySelectorAll('input[name="imp-char"]:checked')).map((i) => i.value)
  );
  const allowAutoDefault = !state.charactersInitialized || !state.charactersKey;
  box.innerHTML = "";
  if (!state.characters.length) {
    state.charactersInitialized = true;
    state.charactersKey = "";
    box.innerHTML = '<span style="color:var(--muted);font-size:11px;">暂未探测到宿主角色，将自动生成具备差异化性格的原生居民。</span>';
    return;
  }
  for (const ch of state.characters) {
    const lbl = document.createElement("label");
    lbl.className = "char-chip";
    const cb = document.createElement("input");
    cb.type = "checkbox";
    cb.name = "imp-char";
    cb.value = ch.name;
    cb.checked = prevChecked.has(ch.name) || (allowAutoDefault && ch.name === "七海千秋");
    const span = document.createElement("span");
    span.textContent = ch.name + (ch.persona_bound ? " · 人格已绑定" : "");
    lbl.appendChild(cb);
    lbl.appendChild(span);
    box.appendChild(lbl);
  }
  state.charactersInitialized = true;
  state.charactersKey = key;
}

function renderRealmsSelect() {
  const relSrc = el("cfg-relation-source");
  if (relSrc) {
    const prevSrc = relSrc.value || "auto";
    const baseOpts = [
      { value: "auto", label: "自动继承文字世界设定（优先默认初始关系，其次各世界已设关系）" },
      { value: "__default__", label: "仅使用角色管理「默认初始关系」" },
      ...state.realms
        .filter((r) => !r.isolated_persona)
        .map((r) => ({
          value: r.realm_space_id,
          label: "仅继承世界「" + (r.name || r.realm_space_id) + "」的情感关系",
        })),
      { value: "story_fresh", label: "不继承文字世界关系（按故事默认：同行旅伴）" },
    ];
    relSrc.innerHTML = baseOpts
      .map((o) => '<option value="' + esc(o.value) + '">' + esc(o.label) + "</option>")
      .join("");
    relSrc.value = baseOpts.some((o) => o.value === prevSrc) ? prevSrc : "auto";
  }

  const sel = el("attach-realm-select");
  if (!sel) return;
  const prev = sel.value;
  if (!state.realms.length) {
    sel.innerHTML = '<option value="">（当前暂无已生成的常驻小镇）</option>';
    el("btn-attach-fate").disabled = true;
    return;
  }
  el("btn-attach-fate").disabled = false;
  sel.innerHTML = state.realms.map((r) =>
    '<option value="' + esc(r.realm_space_id) + '">'
    + esc(r.name || r.realm_space_id)
    + " · " + (r.building_count || 0) + "栋 / " + (r.actors?.length || 0) + "位居民"
    + (r.is_active ? " [当前]" : "")
    + "</option>"
  ).join("");
  if (prev && state.realms.some((r) => r.realm_space_id === prev)) {
    sel.value = prev;
  }
}

function renderSessions() {
  el("sessions-count").textContent = String(state.sessions.length);
  const pane = el("pane-sessions");
  pane.innerHTML = "";
  if (!state.sessions.length) {
    pane.innerHTML =
      '<div class="preview-box">'
      + '<div style="font-weight:600;color:var(--accent);margin-bottom:6px;">等待拨动第一根命运丝线</div>'
      + '<div style="color:var(--muted);font-size:12px;line-height:1.6;">'
      + "在左侧「新建故事」或「挂载小镇」开启后，故事引擎不会预先写死结局，而是在立体楼层与密闭隔间中投放契机，"
      + "完整记录每一位角色的亲历见闻、节点自主选择，并顺着真实选择与后果滚动编排后续章节。"
      + "</div></div>";
    return;
  }

  const phaseLabels = { spark: "初现微光", entangle: "渐入丝线", crossroads: "抉择路口", ripple: "因果涟漪", climax: "心意碰撞", afterglow: "篇章落笔" };
  for (const s of state.sessions) {
    const card = document.createElement("div");
    card.className = "session-item";
    const threads = s.threads || [];
    const activeThread = threads.find((t) => t.status === "active");
    const statusPill = activeThread
      ? '<span class="pill warn">' + esc(phaseLabels[activeThread.phase] || activeThread.phase) + " · 张力 " + Math.round((activeThread.tension || 0) * 100) + "%</span>"
      : '<span class="pill ok">日常稳态 · 已落笔 ' + (s.chronicle_archive?.length || 0) + " 篇</span>";
    const modeTag = s.mode === "standalone"
      ? (s.experience_mode === "observer" ? "独立舞台 · 观剧" : "独立故事小镇")
      : "常驻小镇挂载";

    let html =
      '<div class="session-hd">'
      + '<span class="session-title">🧵 ' + esc(s.title || s.realm_name || s.realm_space_id) + ' <small style="color:var(--muted);font-weight:400;">(' + esc(modeTag) + ")</small></span>"
      + statusPill
      + "</div>";

    const showThread = activeThread || threads[threads.length - 1];
    if (showThread) {
      html += '<div style="font-size:12px;margin:4px 0 8px;"><strong style="color:var(--accent);">《' + esc(showThread.title) + "》</strong> — " + esc(showThread.premise || "") + "</div>";
      for (const node of (showThread.nodes || [])) {
        const cls = node.status === "active" ? "active" : "done";
        const fl = node.target_floor_label ? "(" + node.target_floor_label + ")" : "";
        const loc = (node.target_space_name || "") + fl + (node.target_zone_name ? "·" + node.target_zone_name : "");
        const choices = Object.values(node.participant_choices || {}).map((c) =>
          "<li><b>" + esc(c.actor_name) + "</b> [" + esc(c.stance_label || c.stance) + "]：" + esc(c.choice_summary)
          + (c.inner_reason ? '<div style="color:var(--accent-2);font-size:11px;">心路：' + esc(c.inner_reason) + "</div>"
            : (c.inner_hidden ? '<div style="color:var(--muted);font-size:11px;">（内心独白已按设置收起，可切换查看或待收束揭晓）</div>' : ""))
          + "</li>"
        ).join("");
        const pStance = node.player_stance
          ? '<div style="font-size:11px;color:var(--accent);margin-top:3px;">你的表态 [' + esc(node.player_stance.stance_label) + "]：" + esc(node.player_stance.note) + "</div>"
          : "";
        const stepLabel = Number(showThread.max_nodes || 0) > 0
          ? ("第 " + (node.seq || 1) + "/" + showThread.max_nodes + " 拍")
          : ("第 " + (node.seq || 1) + " 幕");
        html +=
          '<div class="node-card ' + cls + '">'
          + '<div style="font-size:12px;font-weight:600;color:var(--accent-2);">' + stepLabel + " · " + esc(node.title) + (loc ? "（" + esc(loc) + "）" : "") + "</div>"
          + '<div style="font-size:12px;margin-top:3px;">' + esc(node.situation) + "</div>"
          + (node.status === "active" ? '<div style="font-size:11px;color:var(--muted);margin-top:3px;">十字路口：' + esc(node.dilemma_frame) + "</div>" : "")
          + pStance
          + (choices ? '<ul style="margin:5px 0 0 16px;font-size:11px;">' + choices + "</ul>" : '<div style="font-size:11px;color:var(--muted);margin-top:3px;">等待在场角色感知节点并做出决定…</div>')
          + (node.outcome_summary ? '<div style="font-size:11px;color:var(--ok);margin-top:4px;">↳ 因果推进：' + esc(node.outcome_summary) + "</div>" : "")
          + "</div>";
      }
      if (showThread.chapter_chronicle) {
        const cc = showThread.chapter_chronicle;
        html += '<div class="preview-box" style="margin-top:6px;"><b>📜 ' + esc(cc.title) + '</b><div style="font-size:11px;color:var(--muted);margin-top:3px;">' + esc(cc.epilogue) + "</div></div>";
      }
    }

    const ledgerCards = Object.values(s.ledgers || {}).map((lg) => {
      const exps = (lg.experienced_events || []).slice(-2).map((ev) => esc(ev.summary)).join("；") || "暂无显著见闻";
      const asp = (lg.arc_state?.aspirations || []).slice(-1)[0] || "";
      const prom = (lg.arc_state?.promises || []).slice(-1)[0] || "";
      return '<div class="ledger-card">'
        + "<strong>" + esc(lg.name) + (lg.is_player ? "（你）" : "") + "</strong>"
        + '<div style="color:var(--muted);margin-top:2px;">见闻：' + exps + "</div>"
        + (asp ? '<div style="color:var(--accent);margin-top:2px;">念想：' + esc(asp) + "</div>" : "")
        + (prom ? '<div style="color:var(--accent-2);margin-top:2px;">承诺：' + esc(prom) + "</div>" : "")
        + "</div>";
    }).join("");
    if (ledgerCards) {
      html += '<div class="ledger-grid">' + ledgerCards + "</div>";
    }

    card.innerHTML = html;
    const actRow = document.createElement("div");
    actRow.className = "session-actions";

    const mkBtn = (label, cls, handler) => {
      const b = document.createElement("button");
      b.className = "btn sm " + (cls || "");
      b.textContent = label;
      b.onclick = () => handler(b);
      return b;
    };

    const enter = document.createElement("a");
    enter.className = "btn sm primary";
    enter.textContent = "进入故事世界";
    const q = new URLSearchParams({ space_id: s.realm_space_id, view: "world" });
    if (s.mode === "standalone") q.set("mode", "story");
    enter.href = withToken("/api/plugins/community.nanami.world/frontend/world_canvas/?" + q);
    actRow.appendChild(enter);

    if (activeThread) {
      actRow.appendChild(mkBtn("⏩ 推进一拍", "", async (b) => {
        const orig = b.textContent;
        b.disabled = true;
        b.textContent = "⏳ 推演中…";
        try {
          const res = await runAction("tick_fate_session", { session_id: s.session_id, force_evaluate: true, sync_models: true });
          updateFromServer(res);
          toast("已顺着角色的选择与后果编排下一拍。");
        } catch (e) { toast(e.message, true); } finally { b.disabled = false; b.textContent = orig; }
      }));
    } else {
      actRow.appendChild(mkBtn("✨ 拨动新丝线", "", async (b) => {
        const orig = b.textContent;
        b.disabled = true;
        b.textContent = "⏳ 编织中…";
        try {
          const res = await runAction("pluck_fate_thread", { session_id: s.session_id });
          updateFromServer(res);
          toast("已拨动一条新的命运丝线。");
        } catch (e) { toast(e.message, true); } finally { b.disabled = false; b.textContent = orig; }
      }));
    }

    actRow.appendChild(mkBtn(s.reveal_inner_thoughts ? "🙈 隐藏心路" : "👁 查看心路", "", async (b) => {
      b.disabled = true;
      try {
        const res = await runAction("toggle_fate_thoughts", { session_id: s.session_id });
        updateFromServer(res);
      } catch (e) { toast(e.message, true); } finally { b.disabled = false; }
    }));

    if (s.mode === "standalone") {
      actRow.appendChild(mkBtn("🗑️ 删除故事舞台", "danger", () => {
        openConfirm("删除独立故事舞台", "将彻底删除这个独立生成的故事舞台、原生居民与角色记忆（不影响主档与常驻小镇）。确认删除吗？", async () => {
          const res = await runAction("detach_fate_session", { session_id: s.session_id, delete_world: true });
          updateFromServer(res);
          toast("已删除独立故事舞台。");
        });
      }));
    } else {
      actRow.appendChild(mkBtn("解绑（保留小镇）", "danger", () => {
        openConfirm("解绑命运丝线", "确定解绑该常驻小镇的命运丝线吗？（小镇建筑、居民与物品会完整保留）", async () => {
          const res = await runAction("detach_fate_session", { session_id: s.session_id, delete_world: false });
          updateFromServer(res);
          toast("已解绑命运丝线，小镇完整保留。");
        });
      }));
    }

    card.appendChild(actRow);
    pane.appendChild(card);
  }
}

function updateFromServer(res) {
  if (Array.isArray(res.sessions)) state.sessions = res.sessions;
  else if (Array.isArray(res.fate_sessions)) state.sessions = res.fate_sessions;
  if (Array.isArray(res.realms)) {
    state.realms = res.realms;
    renderRealmsSelect();
  }
  sessionsRevision++;
  renderSessions();
}

async function loadLobbyState() {
  try {
    const rev = sessionsRevision;
    const res = await runAction("get_lobby_state", {});
    const pill = el("world-status-pill");
    if (res.world_available) {
      pill.textContent = "文字世界已连接";
      pill.className = "pill ok";
    } else {
      pill.textContent = "文字世界未就绪";
      pill.className = "pill err";
    }
    state.characters = res.characters || [];
    renderCharacters();
    if (Array.isArray(res.realms)) {
      state.realms = res.realms;
      renderRealmsSelect();
    }
    if (rev === sessionsRevision) {
      state.sessions = res.sessions || res.fate_sessions || [];
      renderSessions();
    }
  } catch (e) {
    toast(e.message, true);
  }
}

async function createFateStory() {
  const btn = el("btn-create-fate");
  const orig = btn.textContent;
  btn.disabled = true;
  btn.textContent = "⏳ 正在生成多层舞台与第一道命运丝线…";
  const checkedChars = Array.from(document.querySelectorAll('input[name="imp-char"]:checked')).map((i) => i.value);
  try {
    const res = await runAction("create_fate_story", {
      title: el("cfg-title").value.trim(),
      theme_compass: el("cfg-theme").value,
      experience_mode: el("cfg-mode").value,
      world_mode: el("cfg-world-mode").value,
      max_nodes: Number(el("cfg-max-nodes").value || 0),
      building_count: Number(el("cfg-building-count").value || 5),
      native_npc_count: Number(el("cfg-native-count").value || 2),
      player_name: el("cfg-player-name").value.trim() || "旅人",
      world_prompt: el("cfg-world-prompt").value.trim(),
      outline: el("cfg-outline").value.trim().slice(0, 800),
      imported_characters: checkedChars,
      relation_source: el("cfg-relation-source") ? el("cfg-relation-source").value : "auto",
      use_llm: Boolean(el("cfg-use-llm").checked),
    });
    updateFromServer(res);
    toast("已生成多层故事世界，并在室内悄悄落下了第一道命运丝线。");
  } catch (e) {
    toast(e.message, true);
  } finally {
    btn.disabled = false;
    btn.textContent = orig;
  }
}

async function attachFateWorld() {
  const realmId = el("attach-realm-select")?.value || "";
  if (!realmId) return;
  const btn = el("btn-attach-fate");
  const orig = btn.textContent;
  btn.disabled = true;
  btn.textContent = "⏳ 正在挂载并拨动命运丝线…";
  try {
    const res = await runAction("attach_fate_world", {
      realm_space_id: realmId,
      theme_compass: el("attach-theme").value,
      prompt_hint: el("attach-hint").value.trim(),
    });
    updateFromServer(res);
    toast("已挂载小镇并拨动第一根命运丝线。");
  } catch (e) {
    toast(e.message, true);
  } finally {
    btn.disabled = false;
    btn.textContent = orig;
  }
}

function init() {
  state.token = getBridgeToken();
  const charMgrLink = el("story-char-mgr-link");
  if (charMgrLink) {
    charMgrLink.href = withToken("/api/plugins/community.nanami.world/frontend/world_canvas/?view=characters");
  }
  el("modal-close-x").onclick = closeModal;
  el("btn-refresh").onclick = loadLobbyState;
  el("mode-new-btn").onclick = () => switchLeftMode("new");
  el("mode-attach-btn").onclick = () => switchLeftMode("attach");
  el("cfg-world-mode").onchange = () => {
    el("cfg-bldg-wrap").classList.toggle("hidden", !["town", "compound"].includes(el("cfg-world-mode").value));
  };
  el("btn-create-fate").onclick = createFateStory;
  el("btn-attach-fate").onclick = attachFateWorld;

  void loadLobbyState();
  state.pollTimer = setInterval(() => {
    if (!document.hidden) void loadLobbyState().catch(() => {});
  }, 5000);
}

window.addEventListener("DOMContentLoaded", init);
</script>
</body>
</html>
